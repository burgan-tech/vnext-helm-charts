# Redis Sentinel with External Access (no TLS)
# This configuration enables external access via LoadBalancer services

# OpenShift compatibility
openshift:
  enabled: true

replicaCount: 3

image:
  # Registry is named explicitly so mirrors / ImageContentSourcePolicy
  # rules and audits can match on it. Use "" for the runtime default.
  registry: docker.io
  repository: redis
  pullPolicy: IfNotPresent
  tag: "8.8.0-alpine"

# Authentication
auth:
  # Use existing secret for passwords (recommended for production)
  # 
  # IMPORTANT: Secret must exist in the same namespace as this release
  # Example:
  #   kubectl create secret generic my-redis-secret \
  #     --from-literal=redis-password='my-redis-pass' \
  #     --from-literal=sentinel-password='my-sentinel-pass' \
  #     --namespace=my-namespace
  existingSecret: ""
  redis:
    passwordKey: "redis-password"
  sentinel:
    passwordKey: "sentinel-password"

# Redis configuration
redis:
  password: ""  # Auto-generate
  port: 6379

  # Declared, not derived - and declaring it is also what opts this release into
  # the durable-safe defaults and an authoritative persistence block.
  persistenceMode: aof-rdb
  # -> io-threads. "auto" derives max(1, min(cores - 2, 8)) from the container CPU
  # limit, so it follows resources.limits.cpu instead of going stale when you change
  # it. Below 4 cores it correctly derives to nothing - adding threads to a one- or
  # two-core CFS quota only buys throttling.
  #
  # Set here rather than as a chart default because io-threads is NOT
  # runtime-modifiable: defaulting it on would restart every existing release AND
  # change how it schedules work, in an upgrade meant to be routine. A new install
  # from this file gets it; an existing release is never changed behind its back.
  ioThreads: "auto"

  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""  # Leave empty to use default storage class
    accessMode: ReadWriteOnce
  # maxMemory is deliberately NOT pinned: it is derived from
  # resources.limits.memory x redis.maxMemoryRatio, which the declared mode
  # sets (0.8 for diskless, 0.6 for a durable mode - the durable one leaves
  # room for the fork an AOF rewrite or BGSAVE does, where copy-on-write can
  # push the child's RSS well above the parent's).
  #
  # Pinning it is the mistake to avoid here: redis.maxMemory WINS over the
  # ratio, so raising resources.limits.memory would then change nothing and
  # nothing in the rendered config would say so. Set the LIMIT, not this.
  maxMemoryPolicy: "noeviction"
  appendonly: true
  # Was hand-written into extraConfig. First-class now, and rendered
  # BEFORE extraConfig - so anything you add there still wins.
  network:
    tcpKeepalive: 60

  extraConfig: |
    # Nothing here: every line this example used to carry was either a
    # Redis default written out, or is a first-class value now.
# TLS/SSL configuration - disabled for external access without TLS
tls:
  enabled: false

# Sentinel configuration
sentinel:
  password: ""  # Auto-generate
  port: 26379
  quorum: 2
  downAfterMilliseconds: 30000
  failoverTimeout: 180000
  parallelSyncs: 1
  extraConfig: |

# Service configuration
service:
  type: ClusterIP
  redis:
    port: 6379
    nodePort: ""
  sentinel:
    port: 26379
    nodePort: ""
  annotations: {}

# External access configuration
externalAccess:
  enabled: true
  
  service:
    type: LoadBalancer
    redisPort: 6379
    sentinelPort: 26379
    
    # IMPORTANT: Configure one IP per pod
    # Replace with your actual LoadBalancer IPs
    loadBalancerIPs:
      - "10.1.2.11"
      - "10.1.2.12"
      - "10.1.2.13"
    
    # MetalLB configuration example
    annotations:
      metallb.universe.tf/address-pool: addresspool-redis
    
    labels: {}
    loadBalancerSourceRanges: []
    externalTrafficPolicy: Cluster
  
  restartJob:
    helmHookTimeout: "20m"
    podReadyTimeout: 300
    delayBetweenPods: 10

# Resource limits
resources:
  redis:
    limits:
      cpu: 1000m
      memory: 3Gi
    requests:
      cpu: 100m
      memory: 256Mi
  sentinel:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  # values.yaml pins maxUnavailable=1 and the template prefers it over
  # minAvailable, so it has to be nulled out for minAvailable to apply.
  maxUnavailable: null
  minAvailable: 2

# Pod anti-affinity
# Pod anti-affinity configuration
# Leave as {} to use default soft anti-affinity with matchLabels
# The default automatically uses: app.kubernetes.io/instance and app.kubernetes.io/name
affinity: {}

# Metrics
metrics:
  enabled: false
  serviceMonitor:
    enabled: false

