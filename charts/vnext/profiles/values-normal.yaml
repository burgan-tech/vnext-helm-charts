redis-sentinel:
  # 3 nodes / quorum 2 is the minimum that can actually elect a new master. Redis is
  # idle at every observed load (12-17m CPU, 58-84Mi RSS), so do NOT scale nodes to
  # fix connection errors -- scale poolSize and maxClients.
  replicaCount: 3
  sentinel:
    quorum: 2
  redis:
    network:
      maxClients: 10000
    # io-threads intentionally left unset. They only help a node bottlenecked on many
    # connections or large values, and this Redis is idle. "auto" would also be a
    # no-op here: it derives max(1, min(cores-2, 8)) from the CPU limit, so anything
    # under a 3-core limit collapses to 1 and emits nothing.
    ioThreads: ""
  resources:
    # limits.memory is ALSO the maxmemory knob: maxmemory = 0.78 x this unless
    # redis.maxMemory is set. Here that is ~1.6Gi against an observed ~84Mi dataset.
    redis:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    sentinel:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
