{{- if and .Values.pythonRuntime.enabled .Values.pythonRuntime.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vnext.fullname" . }}-python-runtime
  labels:
    {{- include "vnext.componentLabels" (dict "context" . "component" "python-runtime") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vnext.componentSelectorLabels" (dict "context" . "component" "python-runtime") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The orchestrator's sidecar is the only caller (sidecar-to-sidecar, Dapr internal port).
    - from:
        - podSelector:
            matchLabels:
              {{- include "vnext.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 14 }}
    {{- with .Values.pythonRuntime.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
