# Source: vnext/templates/init/post-request-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: contract-vnext-component-publisher
  labels:
    app.kubernetes.io/name: vnext-component-publisher
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: component-publisher
          image: "alpine/curl:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: VNEXT_INIT_URL
              value: "http://contract-vnext-orchestrator-initializer:3000"
            - name: APP_DOMAIN
              value: "core"
            - name: VNEXT_COMPONENT_VERSION
              value: "0.0.20"
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for orchestrator-initializer..."
              while ! curl -s -o /dev/null -w "%{http_code}" "$VNEXT_INIT_URL/health" | grep -q "^200$"; do
                echo "Orchestrator-initializer not ready, retrying in 5s..."
                sleep 5
              done
              echo "Orchestrator-initializer is ready"

              curl -sX POST "$VNEXT_INIT_URL/api/package/runtime/publish" \
              -H "Content-Type: application/json" \
              -d "{\"version\": \"${VNEXT_COMPONENT_VERSION}\", \"appDomain\": \"${APP_DOMAIN}\"}" \
              --fail

              if [ $? -ne 0 ]; then
                echo "Init post request failed!"
                exit 1
              fi
