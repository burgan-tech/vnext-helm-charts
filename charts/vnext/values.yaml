    pullPolicy: ""

  # Dapr sidecar configuration for this service
  dapr:
    # Enable Dapr sidecar injection for this service
    enabled: true
    # Dapr application ID (if empty, auto-generated as: vnext-<domain>-app)
    # Used for service discovery and pub/sub
    appId: ""

  podAnnotations:
    dapr.io/config: appconfig
  podLabels: {}

  # Uses global.resources.default if empty
  resources: {}
  
  # Application-specific configuration
  # These environment variables configure the vNext application behavior
  appEnvConfig:
    # Enable Vault integration for secrets management
    # When enabled, database and Redis credentials are fetched from Vault
    # When disabled, credentials are read from ConfigMap (not recommended for production)
    Vault__Enabled: "true"
    # Default logging level (Trace, Debug, Information, Warning, Error, Critical)
    Logging__LogLevel__Default: "Information"

# ==============================================================================
# DEPENDENCY CHARTS CONFIGURATION
# ==============================================================================

# HashiCorp Vault configuration
vault:
  enabled: true
  server:
    secretShares: 5
    secretThreshold: 3
  injector:
    enabled: true
  global:
    openshift: false


# Dapr (Distributed Application Runtime)
dapr:
  enabled: true
  global:
    logAsJson: true
    ha:
      enabled: false
      replicaCount: "3"
      disruption:
        minimumAvailable: ""
        maximumUnavailable: "25%"
    prometheus:
      enabled: true
      port: "9090"
    mtls:
      enabled: true
      workloadCertTTL: 24h
      allowedClockSkew: 15m
    daprControlPlaneOs: linux
  
  dapr_operator:
    watchInterval: "3m"
  
  runAsNonRoot: true
  
  dapr_scheduler:
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: dapr-scheduler
              topologyKey: topology.kubernetes.io/zone
  
  dapr_placement:
    runAsNonRoot: true
    enableMetrics: true
    extraArgs:
      - "--replicationFactor=100"
  
  dapr_sentry:
    tls:
      root:
        ttl: 8760h
      issuer:
        ttl: 2160h

# Redis Sentinel configuration
redis-sentinel:
  enabled: true
  replicaCount: 1
  openshift:
    enabled: false
  
  redis:
    password: ""
    extraConfig: |
      # Performance optimizations
      tcp-keepalive 60
      timeout 0
      # Disable persistence for better performance (adjust for production)
      appendonly no
      save ""
      stop-writes-on-bgsave-error no
      # Replication optimizations
      repl-diskless-sync yes
      appendfsync no
      repl-diskless-load on-empty-db
      lazyfree-lazy-eviction yes
      lazyfree-lazy-expire yes
      lazyfree-lazy-server-del yes
      lazyfree-lazy-user-del yes
      replica-lazy-flush yes
    
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
      accessMode: ReadWriteOnce

      maxMemory: "3072mb"
      maxMemoryPolicy: "noeviction"
      appendonly: false
  
  securityContext:
    runAsNonRoot: true
    # Uncomment below for non-OpenShift environments if needed:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  
  auth:
    existingSecret: ""
    redis:
      passwordKey: "redis-password"
    sentinel:
      passwordKey: "sentinel-password"
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: redis-sentinel
  
  resources:
    redis:
      limits:
        cpu: 1000m
        memory: 3Gi
      requests:
        cpu: 100m
        memory: 256Mi
    sentinel:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
  
  metrics:
    enabled: true

# ==============================================================================
# OPTIONAL DEVELOPMENT TOOLS
# These tools are useful for development and debugging but should be disabled
# in production environments for security and resource optimization.
# ==============================================================================

# RedisInsight - Redis GUI tool
