{{- include "vnext.validatePubsubType" . -}}
{{- if eq .Values.global.dapr.pubsub.type "kafka" }}
{{- $root := . }}
{{- $kafka := .Values.global.externalKafka }}
{{- /* One component per pubsub host so each gets its own metadata (consumerGroup,
       clientID ...). component -> its key under global.externalKafka.metadata.
       The component name must match vnext.pubsubStoreName, which feeds the host's
       DAPR_PUBSUB_STORE_NAME. */}}
{{- $hosts := list
      (list "orchestrator"  "orchestrator")
      (list "execution"     "execution")
      (list "worker-inbox"  "inbox")
      (list "worker-outbox" "outbox")
}}
{{- range $h := $hosts }}
{{- $component := index $h 0 }}
{{- $key := index $h 1 }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "vnext.pubsubStoreName" (dict "root" $root "component" $component) }}
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: {{ $kafka.endpoint | quote }}
  - name: authType
    value: "password"
  - name: saslUsername
    {{- if $kafka.auth.useSecretEngine }}
    secretKeyRef:
      name: {{ $kafka.auth.secret.name }}
      key: {{ $kafka.auth.secret.usernameKey }}
    {{- else }}
    value: {{ $kafka.auth.username | quote }}
    {{- end }}
  - name: saslPassword
    {{- if $kafka.auth.useSecretEngine }}
    secretKeyRef:
      name: {{ $kafka.auth.secret.name }}
      key: {{ $kafka.auth.secret.passwordKey }}
    {{- else }}
    value: {{ $kafka.auth.password | quote }}
    {{- end }}
  {{- /* Every entry of externalKafka.metadata.<key> is emitted as a {name, value} or
       {name, secretKeyRef} pair; an entry whose value is "" is omitted. */}}
  {{- range $i, $m := index ($kafka.metadata | default dict) $key | default list }}
  {{- if not $m.name }}
  {{- fail (printf "global.externalKafka.metadata.%s[%d].name is required" $key $i) }}
  {{- end }}
  {{- if has $m.name (list "brokers" "authType" "saslUsername" "saslPassword") }}
  {{- fail (printf "global.externalKafka.metadata.%s[%d]: %q is rendered by the chart from endpoint/auth; remove it from metadata" $key $i $m.name) }}
  {{- end }}
  {{- $v := $m.value }}
  {{- /* Helm reads YAML numbers as float64, so 1048576 would print as 1.048576e+06. */}}
  {{- if and (kindIs "float64" $v) (eq $v (floor $v)) }}{{- $v = int64 $v }}{{- end }}
  {{- if $m.secretKeyRef }}
  - name: {{ $m.name }}
    secretKeyRef:
      {{- toYaml $m.secretKeyRef | nindent 6 }}
  {{- else if and (not (kindIs "invalid" $v)) (ne ($v | toString) "") }}
  - name: {{ $m.name }}
    value: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
auth:
  secretStore: {{ include "vnext.fullname" $root }}-secret
scopes:
- {{ include "vnext.daprAppId" (dict "component" $component "appDomain" $root.Values.global.appDomain) | quote }}
{{- end }}
{{- end }}
