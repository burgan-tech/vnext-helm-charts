# ==============================================================================
# MCP SERVER CONFIGURATION
# vNext MCP server (vnext-runtime). A thin, standalone Model Context Protocol
# server that proxies the Orchestration HTTP API so MCP-capable agents can
# discover and read a domain's components / runtime data / meta.
# It has NO DB / Redis / Dapr references and depends on the Orchestration API,
# so it only starts once the orchestrator reports healthy.
# ==============================================================================
mcpServer:
  # Enable or disable the MCP server (installed by default)
  enabled: true

  # Number of replicas to deploy
  replicaCount: 1

  # Container image configuration
  image:
    # Image repository path
    repository: ghcr.io/burgan-tech/vnext/mcp-server
    # Image tag (if empty, defaults to chart appVersion)
    tag: ""
    # Image digest for immutable reference (e.g., "sha256:abc123...")
    digest: ""
    # Image pull policy (if empty, uses global.imagePullPolicy)
    pullPolicy: ""

  # Override global image pull secrets for this service if needed
  imagePullSecrets: []

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}

  # Use global securityContext, override if needed
  securityContext: {}

  service:
    type: ClusterIP
    port: 5000

  # Ingress configuration for external access (the MCP server ships with ingress)
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: mcp.example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  # Uses global.resources.default if empty
  resources: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # MCP-specific configuration (rendered as Mcp__* environment variables).
  # NOTE: Mcp__ApiKey is intentionally NOT exposed here — the application handles
  # its own API key via its appsettings; the chart must not inject it.
  config:
    # Register mutating tools (start/transition/retry/publish/invalidate). Keep false for read-only.
    allowMutations: false
    # Register get_mapping_code (returns executable .csx source).
    allowCodeRead: true
    # npm package holding the vnext-meta JSON (fetched once at startup).
    metaPackageName: "@burgan-tech/vnext-meta"
    # Pinned meta version (never "latest").
    metaPackageVersion: "0.0.61"

  # Additional custom environment variables (added to the service's ConfigMap)
  extraEnvConfig: {}

