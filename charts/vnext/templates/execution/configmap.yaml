{{- if .Values.execution.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vnext.fullname" . }}-execution-config
  labels:
    {{- include "vnext.componentLabels" (dict "context" . "component" "execution") | nindent 4 }}
data:
  # Common environment variables for all .NET services
  {{- include "vnext.commonEnvVars" . | nindent 2 }}
  
  # Global .NET environment variables
  {{- include "vnext.dotnetEnvVars" .Values.global.dotnetEnv | nindent 2 }}

  # Application-level environment variables
  {{- include "vnext.appEnvVars" .Values.global.appEnvConfig | nindent 2 }}
  
  # Telemetry configuration
  {{- include "vnext.telemetryEnvVars" (dict "serviceName" (printf "vnext-%s-execution-app" ( .Values.global.appDomain )) "serviceVersion" (.Values.execution.image.tag | default .Chart.AppVersion) "global" .Values.global "context" .) | nindent 2 }}
  
  {{- if eq .Values.execution.appEnvConfig.Vault__Enabled "false" }}
  # Database configuration
  ConnectionStrings__Default: {{ .Values.global.database.connectionString | quote }}
  {{- end }}
  
  # Redis configuration
  Redis__Standalone__EndPoints__0: {{ include "vnext.redisEndpoint" . | quote }}

  vNextApi__BaseUrl: {{ printf "http://vnext-%s-orchestrator:5000" ( .Values.global.appDomain ) | quote }}

  APP_DOMAIN: {{ .Values.global.appDomain | quote }}
  DAPR_APP_ID: {{ printf "vnext-%s-execution-app" ( .Values.global.appDomain ) | quote }}
  OrchestrationApi__AppId: {{ .Values.orchestrator.dapr.appId | default (printf "vnext-%s-app" .Values.global.appDomain) | quote }}

  # Execution's second Kestrel listener (HTTP/2-only h2c gRPC — see execution.grpcPort
  # in values.yaml for why it can't share a port with the HTTP/1.1 MVC/health/swagger
  # listener). Sourced from execution.grpcPort, the SAME values.yaml number the container's
  # second ports[] entry (deployment.yaml) uses, so the app's actual binding and the pod
  # spec can never disagree about which port speaks gRPC.
  #
  # Deliberately NOT sourced from execution.dapr.appPort (the dapr.io/app-port annotation).
  # That value is protocol-dependent — 5000 while dapr.protocol is "http" (the default),
  # same as ASPNETCORE_URLS's HTTP/1.1 port below. If this key read dapr.appPort instead,
  # the default deployment would try to bind port 5000 twice (Http1 here, Http2 there) and
  # crash-loop at startup with an address-in-use error the moment the pod started — this
  # regressed once already; do not reintroduce the coupling.
  #
  # The HTTP/1.1 port is deliberately NOT declared here as a matching "Kestrel__HttpPort".
  # ASPNETCORE_URLS (set above by vnext.commonEnvVars) already declares it, and Execution's
  # Program.cs now parses that value back out at startup instead of reading a bespoke key —
  # registering the gRPC endpoint makes Kestrel discard the hosting URLs unless something
  # explicitly re-derives an HTTP/1.1 endpoint from them.
  #
  # ASPNETCORE_URLS is NOT derived from execution.service.port — it is the hardcoded literal
  # "http://+:5000" baked into vnext.commonEnvVars (_helpers.tpl), the same block every other
  # .NET service includes. execution.service.port only moves the Service object and the probe
  # target port; it does NOT move the app's actual listener. Changing execution.service.port
  # without also touching vnext.commonEnvVars therefore does not do what it looks like it
  # does — the Service would point at a port the app never binds. A "Kestrel__HttpPort" key
  # here would be a second, and equally disconnected, source of truth for that same port. Do
  # not reintroduce it.
  Kestrel__GrpcPort: {{ .Values.execution.grpcPort | quote }}

  # Component-specific environment variables
  {{- if .Values.execution.extraEnvConfig }}
  {{- range $key, $value := .Values.execution.extraEnvConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  
  # Application configuration
  {{- if .Values.execution.appEnvConfig }}
  {{- range $key, $value := .Values.execution.appEnvConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  
{{- end }}
