apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: contract-kube-prometheus-s-kubernetes-system
  namespace: default
  labels:
    app: kube-prometheus-stack
    
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: contract
    app.kubernetes.io/version: "78.4.0"
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-78.4.0
    release: "contract"
