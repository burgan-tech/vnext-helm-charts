{{- include "vnext.validateNameResolution" . -}}
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: appconfig
spec:
  features:
  - enabled: true
    name: HotReload
{{- with .Values.global.dapr.nameResolution }}
{{- if .component }}
  # How a caller sidecar turns an app-id into a sidecar-to-sidecar address. Reaches every
  # component because they all carry `dapr.io/config: appconfig` in their podAnnotations.
  #
  # `kubernetes` is already Dapr's default in Kubernetes mode, so this block is a
  # no-op by design — it exists to make cross-namespace resolution explicit and to give
  # the template a single home. See global.dapr.nameResolution in values.yaml for why
  # `nameformat` cannot serve this topology (it never reads req.Namespace, while Dapr
  # pins mTLS to the real (namespace, app-id) pair).
  nameResolution:
    component: {{ .component | quote }}
    {{- if or .template .clusterDomain }}
    configuration:
      {{- /*
        `template` is quoted straight from values so its {{.ID}} / {{.Namespace}} /
        {{.Port}} reach the sidecar LITERALLY — they are Dapr's Go template, not Helm's.
        Never inline the template text in this file: Helm would evaluate it here and
        render an empty address, which fails silently (the sidecar resolves to
        "-dapr..:" and every invocation dies with ERR_DIRECT_INVOKE).
      */ -}}
      {{- with .template }}
      template: {{ . | quote }}
      {{- end }}
      {{- with .clusterDomain }}
      clusterDomain: {{ . | quote }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
  metric:
    enabled: false
  metrics:
    enabled: true
  tracing:
    otel:
      endpointAddress: {{ include "vnext.otelEndpoint" . | trimPrefix "http://" | trimPrefix "https://" | quote }}
      isSecure: false
      # Must agree with the port in endpointAddress above: a collector serves OTLP/gRPC on 4317
      # and OTLP/HTTP on 4318. This was hardcoded to `http` while every endpoint the chart
      # produces ends in :4317, so the sidecar POSTed OTLP/HTTP at a gRPC-only receiver and every
      # span it created was dropped — silently, because Dapr logs no exporter error. The app was
      # unaffected: it reads global.telemetry.protocol directly. So app spans arrived while
      # sidecar spans never did, and each callee transaction was left naming a parent span no
      # backend ever received, which Elastic APM re-roots to the trace root — detaching the whole
      # Execution subtree from the `Dapr invoke` span that caused it.
      #
      # Derived from the same value the app uses, so the two can no longer disagree. Dapr accepts
      # only `grpc` or `http`; the .NET side spells the HTTP option `http/protobuf`, hence the
      # mapping instead of a passthrough.
      protocol: {{ if hasPrefix "http" .Values.global.telemetry.protocol }}http{{ else }}grpc{{ end }}
    # Parameterised so an environment can dial sidecar-rooted tracing down without a chart
    # edit. Default "1". See global.telemetry.samplingRate for what this actually affects —
    # Dapr's sampler is ParentBased, so this governs only traces the sidecar itself roots.
    # `default` is deliberately NOT used here: Go templates treat 0 as empty, so
    # `| default "1"` silently turns a deliberate samplingRate=0 (tracing off) back into
    # full sampling. Nil is detected explicitly instead, which leaves 0 meaning 0.
    samplingRate: {{ if kindIs "invalid" .Values.global.telemetry.samplingRate }}"1"{{ else }}{{ .Values.global.telemetry.samplingRate | quote }}{{ end }}
