# ==============================================================================
# GLOBAL CONFIGURATION
# Configuration shared across all components in the vNext platform
# ==============================================================================

global:
  # Application domain identifier - used for naming Dapr apps and service discovery
  # This value is required and must be unique per app
  # Example: "banking", "contract", "core"
  appDomain: "core"

  # Runtime configuration (runtimeconfig.json) for the vNext platform.
  # Written verbatim into the -runtime ConfigMap. Overriding replaces the whole
  # document, so repeat every key you want to keep.
  runtimeConfigJson: |
    {
      "runtimeOptions": {
        "configProperties": {
          "System.Threading.ThreadPool.MinThreads": 50
        }
      }
    }

  notificationComponents: []
    # - name: sms
    #   spec: 
    #     type: bindings.http
    #     version: v1
    #     metadata:
    #       - name: url
    #         value: http://mocklab:3001/api/notification/sms
    #   auth:
    #     secretStore: vnext-secret
    # - name: state
    #   spec:
    #     type: bindings.http
    #     version: v1
    #     metadata:
    #       - name: url
    #         value: http://mocklab:3001/api/notification/state

  # Dynamic pub/sub components for event-driven workflows.
  # Each entry renders a Dapr Component scoped to the orchestrator (vnext-<appDomain>-app) sidecar.
  # The component name is used verbatim; reference it from subscriptionComponents[].spec.pubsubname.
  pubsubComponents: []
    # - name: kafka-events
    #   spec:
    #     type: pubsub.kafka
    #     version: v1
    #     metadata:
    #       - name: brokers
    #         value: "kafka:9092"
    #       - name: authType
    #         value: none
    #   auth:
    #     secretStore: vnext-secret

  # Dynamic subscriptions for event-driven workflows.
  # Each entry renders a Dapr Subscription (v2alpha1) scoped to the orchestrator sidecar.
  subscriptionComponents: []
    # - name: order-created-sub
    #   spec:
    #     pubsubname: kafka-events          # must match a pubsubComponents[].name
    #     topic: order.created
    #     routes:
    #       default: /events/order-created
    #       # rules:
    #       #   - match: 'event.type == "priority"'
    #       #     path: /events/order-created-priority
    #     # deadLetterTopic: order.created.DLQ
    #     # metadata:
    #     #   rawPayload: "true"

  # Dynamic Dapr Conversation (AI/LLM) components for workflows.
  # Each entry renders a Dapr Component scoped to the execution (vnext-<appDomain>-execution-app) sidecar,
  # since the DaprConversationTask runs inside the Execution API.
  # The component name is used verbatim; reference it from a workflow's DaprConversationTask componentName.
  # Provider API keys should be supplied via secretKeyRef (see auth.secretStore below), not inline values.
  conversationComponents: []
    # - name: openai
    #   spec:
    #     type: conversation.openai
    #     version: v1
    #     metadata:
    #       - name: key
    #         secretKeyRef:
    #           name: vnext-secret
    #           key: openai-api-key
    #       - name: model
    #         value: gpt-4o-mini
    #   auth:
    #     secretStore: vnext-secret
    # - name: anthropic
    #   spec:
    #     type: conversation.anthropic
    #     version: v1
    #     metadata:
    #       - name: key
    #         secretKeyRef:
    #           name: vnext-secret
    #           key: anthropic-api-key
    #       - name: model
    #         value: claude-3-5-sonnet-20240620
    #   auth:
    #     secretStore: vnext-secret

  # External Vault configuration
  # Use this when connecting to an existing HashiCorp Vault instance
  externalVault: 
    # Set to true to use an external Vault instead of the bundled one
    enabled: false
    # External Vault server address (e.g., "https://vault.example.com:8200")
    address: ""
    # Secret engine name/path in Vault. If empty, will be auto-generated
    # Format: vnext-<appDomain>-engine
    secretEngineName: ""
    vaultToken: "enter-vault-token"

  # Default image pull policy for all components
  # Options: Always, IfNotPresent, Never
  imagePullPolicy: IfNotPresent
  
  # Image pull secrets for private container registries
  # Example:
  #   imagePullSecrets:
  #     - name: regcred
  #     - name: another-secret
  imagePullSecrets: []
  
  # -----------------------------------------------------------------------------
  # .NET Runtime Configuration
  # Common environment variables applied to all .NET services
  # -----------------------------------------------------------------------------
  dotnetEnv:
    # Disable NuGet package signature verification for faster builds
    DOTNET_NUGET_SIGNATURE_VERIFICATION: "false"
    # Use polling for file system changes (required in some container environments)
    DOTNET_USE_POLLING_FILE_WATCHER: "0"
    # Indicate running in containerized environment
    DOTNET_RUNNING_IN_CONTAINER: "true"
    # Use invariant globalization (reduces image size and improves performance)
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    # ASP.NET Core environment (Development, Staging, Production)
    ASPNETCORE_ENVIRONMENT: "Development"

  # -----------------------------------------------------------------------------
  # Application-level Environment Variables
  # Global defaults for all vNext services
  # -----------------------------------------------------------------------------
  appEnvConfig: {}
  
  # -----------------------------------------------------------------------------
  # Dapr (Distributed Application Runtime) Configuration
  # Global settings for Dapr service mesh integration
  # -----------------------------------------------------------------------------
  dapr:
    # Enable or disable Dapr sidecar injection globally
    enabled: true
    # Protocol the SIDECAR uses to call THE APP (dapr.io/app-protocol) — the inbound
    # direction only: service-invocation delivery, pub/sub delivery, job callbacks.
    #
    # This is NOT how the app calls its sidecar. That direction is chosen by the SDK method
    # the code calls (DaprClient's InvokeMethodAsync family is HTTP, InvokeMethodGrpcAsync is
    # gRPC) and no Helm value can change it. Sidecar-to-sidecar is always gRPC regardless.
    #
    # This value is a real fallback, not decoration: vnext.daprAnnotations (_helpers.tpl)
    # resolves each component's app-protocol as `<component>.dapr.protocol | default
    # global.dapr.protocol | default "http"`. Before the Task 7 execution-gRPC change, no
    # component set its own dapr.protocol, so this key rendered nowhere and every component
    # silently took the helper's bare "http" literal instead — changing it here would have
    # done nothing. Wired as the real fallback so it now actually governs anything that
    # doesn't override it.
    #
    # MUST stay "http". Setting "grpc" HERE flips every component that doesn't set its own
    # dapr.protocol — orchestrator, both workers, db-migrator (annotation currently
    # suppressed for db-migrator specifically, see vnext.daprAnnotations) — over to the Dapr
    # AppCallback gRPC service, which none of them implement: they expose the HTTP surface
    # (UseCloudEvents + MapSubscribeHandler + MVC controllers) and register no gRPC service.
    # The switch fails closed on nothing: it silently breaks every inbound path at once.
    #
    # execution is the ONE deliberate exception, and it overrides locally rather than here:
    # see execution.dapr.protocol below for why, and what it costs.
    protocol: "http"
    # Dapr placement service endpoint for actor placement
    placementHost: "dapr-placement:50005"
    # HTTP port for Dapr sidecar API
    httpPort: "42110"
    # gRPC port for Dapr sidecar API
    grpcPort: "42111"
    # Maximum HTTP request body size for Dapr sidecar in MB (Dapr default: 4).
    # Increase when large document payloads cause HTTP 499 on the sidecar.
    httpMaxRequestSize: "64"
  
  # -----------------------------------------------------------------------------
  # OpenTelemetry Configuration
  # Global settings for distributed tracing and observability
  # -----------------------------------------------------------------------------
  telemetry:
    # Enable or disable telemetry collection globally
    enabled: true
    # External OpenTelemetry collector configuration
    external:
      # Set to true to use an external collector instead of the bundled one
      enabled: false
      # External collector endpoint (e.g., "http://otel-collector.observability.svc:4317")
      endpoint: ""
    # Protocol for telemetry export (grpc or http/protobuf)
    protocol: "grpc"

  
  # -----------------------------------------------------------------------------
  # Database Configuration
  # Global settings for database connectivity
  # -----------------------------------------------------------------------------
  database:
    # PostgreSQL connection string
    # Format: Host=<host>;Port=<port>;Database=<db>;Username=<user>;Password=<pass>;
    # This is used when Vault is disabled. When Vault is enabled, connection details
    # are retrieved from Vault secrets.
    connectionString: "Host=vnext-postgres-headless;Port=5432;Database=vNext_WorkflowDb;Username=vnext;Password=changeme;"
    
  
  # -----------------------------------------------------------------------------
  # Redis Configuration
  # Settings for Redis/cache connectivity
  # -----------------------------------------------------------------------------
  # External Redis endpoint configuration
  # Use this when connecting to an existing Redis instance or managed service
  # If empty, will use the bundled Redis Sentinel cluster
  # Example: "redis.example.com:6379" or "redis-cluster.svc:6379"
  externalRedis:
      endpoint: ""
  
  # -----------------------------------------------------------------------------
  # Resource Defaults
  # Default resource limits and requests applied to all services
  # Individual services can override these values
  # -----------------------------------------------------------------------------
  resources:
    default:
      # Maximum resources a container can use
      limits:
        cpu: 1000m      # 1 CPU core
        memory: 2Gi     # 1 gigabyte of RAM
      # Guaranteed resources for a container
      requests:
        cpu: 100m       # 0.1 CPU core
        memory: 256Mi   # 256 megabytes of RAM
  
  # -----------------------------------------------------------------------------
  # Health Probe Defaults
  # Default configuration for Kubernetes liveness and readiness probes
  # Individual services can override these values
  # -----------------------------------------------------------------------------
  probes:
    # Liveness probe determines when to restart a container
    liveness:
      # Number of seconds to wait before performing the first probe
      initialDelaySeconds: 35
      # How often to perform the probe (in seconds)
      periodSeconds: 10
      # Number of consecutive failures before restarting the container
      failureThreshold: 5
      # Number of seconds before timing out
      timeoutSeconds: 30
    
    # Readiness probe determines when a container is ready to accept traffic
    readiness:
      # Number of seconds to wait before performing the first probe
      initialDelaySeconds: 35
      # How often to perform the probe (in seconds)
      periodSeconds: 10
      # Number of consecutive failures before marking as not ready
      failureThreshold: 5
      # Number of consecutive successes before marking as ready
      successThreshold: 2
      # Number of seconds before timing out
      timeoutSeconds: 30
  
  # -----------------------------------------------------------------------------
  # Cosign Image Signature Verification
  # Verifies container image signatures using Sigstore keyless signing
  # Requires Kyverno to be enabled as the admission controller
  # -----------------------------------------------------------------------------
  cosign:
    # Enable Cosign image signature verification
    enabled: false
    # Keyless verification via Sigstore/Fulcio (GitHub Actions OIDC)
    keyless:
      # OIDC issuer URL (GitHub Actions default)
      issuer: "https://token.actions.githubusercontent.com"
      # Subject pattern - GitHub repo identity
      subject: "https://github.com/burgan-tech/*"
    # Sigstore Rekor transparency log URL
    rekor:
      url: "https://rekor.sigstore.dev"
    # Image patterns to verify (defaults to vnext images)
    imagePatterns:
      - "ghcr.io/burgan-tech/vnext/*"
    # Enforcement mode: "Enforce" blocks unsigned images, "Audit" only warns
    validationFailureAction: "Audit"

  # -----------------------------------------------------------------------------
  # Security Context
  # Default security settings applied to all containers
  # Individual services can override these values
  # -----------------------------------------------------------------------------
  securityContext:
    # Drop all Linux capabilities for enhanced security
    capabilities:
      drop:
      - ALL
    # Mount root filesystem as read-only for security
    readOnlyRootFilesystem: true
    # Run container as non-root user (may need adjustment for some images)
    runAsNonRoot: false


# ==============================================================================
# SERVICE ACCOUNT CONFIGURATION
# Kubernetes service account for pod authentication
# More information: https://kubernetes.io/docs/concepts/security/service-accounts/
# ==============================================================================
serviceAccount:
  # Create a new service account (set to false to use an existing one)
  create: true
  # Automatically mount service account token in pods
  automount: true
  # Annotations to add to the service account (useful for IRSA, Workload Identity, etc.)
  # Example for AWS IAM Role:
  #   annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/vnext-role
  annotations: {}
  # Name of the service account to use (if empty, will be generated)
  name: ""

# ==============================================================================
# ORCHESTRATOR SERVICE CONFIGURATION
# Main workflow orchestration engine that manages workflow execution
# ==============================================================================
orchestrator:
  # Enable or disable the orchestrator service
  enabled: true
  
  # Number of replicas to deploy
  # For production, consider using 3+ replicas with autoscaling
  replicaCount: 1
  
  # Container image configuration
  image:
    # Image repository path
    repository: ghcr.io/burgan-tech/vnext/orchestrator
    # Image tag (if empty, defaults to chart appVersion)
    tag: ""
    # Image digest for immutable reference (e.g., "sha256:abc123...")
    # When set, tag is ignored and digest is used instead
    digest: ""
    # Image pull policy (if empty, uses global.imagePullPolicy)
    # Options: Always, IfNotPresent, Never
    pullPolicy: ""
  
  # Init job configuration
  # Runs database migrations and initialization before the main service starts
  initializer:
    # Enable or disable the initialization job
    enabled: true
    # Init job container image
    image:
      repository: ghcr.io/burgan-tech/vnext/init
      tag: ""
    service:
      type: ClusterIP
      port: 3000
    # Environment variables for the init job
    envConfig:
      # vNext core runtime version to initialize
      VNEXT_COMPONENT_VERSION: "0.0.20"
      NPM_REGISTRY: "https://registry.npmjs.org/"
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: initializer.example.local
          paths:
            - path: /
              pathType: Prefix
      tls: []
  
  # Override global image pull secrets for this service if needed
  # If empty, uses global.imagePullSecrets
  imagePullSecrets: []
  
  # Dapr sidecar configuration for this service
  dapr:
    # Enable Dapr sidecar injection for this service
    enabled: true
    # Dapr application ID (if empty, auto-generated as: vnext-<domain>-app)
    # Used for service discovery and pub/sub
    appId: ""
    # Port that the application listens on
    appPort: "5000"
    # Override global.dapr.httpMaxRequestSize for this component. Empty = use global.
    httpMaxRequestSize: ""

  podAnnotations:
    dapr.io/config: appconfig
  podLabels: {}
  podSecurityContext: {}
  
  # Use global securityContext, override if needed
  securityContext: {}
  
  service:
    type: ClusterIP
    port: 5000
  
  # Ingress configuration for external access
  ingress:
    # Enable ingress for external access
    enabled: false
    # Ingress class name (e.g., nginx, traefik, alb)
    className: ""
    # Ingress annotations
    # Example for nginx:
    #   annotations:
    #     nginx.ingress.kubernetes.io/rewrite-target: /
    #     cert-manager.io/cluster-issuer: letsencrypt-prod
    annotations: {}
    # Ingress hosts configuration
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    # TLS configuration
    # Example:
    #   tls:
    #     - secretName: orchestrator-tls
    #       hosts:
    #         - orchestrator.example.com
    tls: []
  
  # Uses global.resources.default if empty
  resources: 
    limits:
      cpu: 1000m      # 1 CPU core
      memory: 4Gi     # 1 gigabyte of RAM
    # Guaranteed resources for a container
    requests:
      cpu: 100m       # 0.1 CPU core
      memory: 256Mi   # 256 megabytes of RAM

  
  # Health check probes (uses global.probes if not specified)
  livenessProbe:
    httpGet:
      path: /live
      port: http
  
  readinessProbe:
    httpGet:
      path: /ready
      port: http
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  
  # Additional custom environment variables
  # These will be added to the service's ConfigMap
  # Example:
  #   extraEnvConfig:
  #     MY_CUSTOM_VAR: "value"
  #     ANOTHER_VAR: "another-value"
  extraEnvConfig: {}
  
  # Application-specific configuration
  # These environment variables configure the vNext application behavior
  appEnvConfig:
    # Enable Vault integration for secrets management
    # When enabled, database and Redis credentials are fetched from Vault
    # When disabled, credentials are read from ConfigMap (not recommended for production)
    Vault__Enabled: "true"
    # Default logging level (Trace, Debug, Information, Warning, Error, Critical)
    Logging__LogLevel__Default: "Debug"
    # Base path for URL templates (empty = no base path)
    UrlTemplates__BasePath: ""
    # Transport the orchestrator's client uses to invoke Execution for task processing:
    # "http" (default) or "grpc" (Dapr proxy-mode). MUST move together with
    # execution.dapr.protocol (and execution.dapr.appPort when going to "grpc") — see
    # the comments there. Changing only one of the two sides breaks every task
    # invocation, not just tracing. Defaulted to "http" so the default deployment is
    # byte-equivalent to before gRPC proxy-mode transport existed: one whole trace.
    ExecutionApi__Transport: "http"

  # ---------------------------------------------------------------------------
  # Plugins
  # A single populator Job (post-install/post-upgrade hook) reconciles a
  # ReadWriteMany PVC before the orchestrator starts; the orchestrator mounts
  # the PVC read-only.
  #
  # A "plugin" is a DLL file. `pluginNames` is an allowlist of DLL file names.
  # Each run the Job installs the listed DLLs that are MISSING from the PVC (a
  # DLL already present is left untouched, so nothing is re-downloaded), then
  # PRUNES any file in the PVC that is not listed. To fetch a missing DLL it
  # clones the repos in list order and copies the match FLAT into `mountPath`;
  # if the same name exists in more than one repo, the LAST repo wins. A listed
  # name not found in any repo fails the Job. Set `forceRefresh: true` to
  # re-download every listed DLL even if already present.
  # ---------------------------------------------------------------------------
  plugins:
    # Enable or disable plugin fetching entirely
    enabled: false

    # Where the plugin DLLs are placed inside the container(s)
    mountPath: /app/assemblies

    # Allowlist of plugin DLL file names to install (exact file names, including
    # the .dll extension). The Job searches each repo's `subPath` recursively
    # for these files. Files in the PVC that are NOT listed here are removed on
    # the next run. Empty list = no plugins installed (existing ones are pruned).
    pluginNames: []
      # - Vnext.PluginA.dll
      # - Vnext.PluginC.dll

    # By default a DLL already present in the PVC is left untouched (not
    # re-downloaded), so repos are only cloned when something is missing.
    # Set true to re-download every listed DLL even if already present — this
    # also re-applies the "last repo wins" rule for duplicate names.
    forceRefresh: false

    # Image used by the Job to clone the repositories
    image:
      repository: alpine/git
      tag: latest
      # If empty, falls back to global.imagePullPolicy
      pullPolicy: ""

    # Shared storage that holds the cloned plugins.
    # MUST be ReadWriteMany so multiple replicas/services can mount it at once.
    persistence:
      # Create a PVC (set false + existingClaim to reuse one)
      enabled: true
      # Reuse an existing RWX PVC instead of creating one
      existingClaim: ""
      # StorageClass that supports ReadWriteMany (e.g. nfs, azurefile, efs-sc).
      # Empty uses the cluster default — which often does NOT support RWX.
      storageClass: ""
      accessMode: ReadWriteMany
      size: 1Gi

    # Default authentication applied to every repo that does not define its own
    # `auth` block. In production prefer `existingSecret`; `token` is for local
    # development only and must never hold a real credential in committed values.
    defaultAuth:
      # Name of an existing Kubernetes Secret holding the git token/PAT
      existingSecret: ""
      # Key inside that secret
      tokenKey: token
      # Inline token (dev only). Synthesized into a generated Secret at install
      # time. Leave empty in committed values.
      token: ""

    # Source repositories that contain the plugin DLLs. Only `url` is required.
    # Each repo is searched (under its `subPath`) for the file names in
    # `pluginNames`. Repos are processed in order, so if the same file name
    # exists in multiple repos, the LAST one listed here wins.
    repos: []
      # - url: https://github.com.tr/_git/vnext
      #   # Branch or tag to check out (optional; defaults to repo HEAD)
      #   ref: master
      #   # Directory inside the repo to search for the DLLs, recursively
      #   # (optional; empty = repo root)
      #   subPath: plugins
      #   # Per-repo auth override. Omit to inherit defaultAuth.
      #   auth:
      #     existingSecret: vnext-plugin-tokens
      #     tokenKey: vnext-core-token
      # - url: https://github.com.tr/_git/vnext
      #   ref: main
      #   # No auth block -> inherits defaultAuth (public repo if defaultAuth empty)

# ==============================================================================
# EXECUTION SERVICE CONFIGURATION
# Workflow execution engine that processes workflow tasks
# ==============================================================================
execution:
  # Enable or disable the execution service
  enabled: true
  
  # Number of replicas to deploy
  # For production, consider using multiple replicas with autoscaling
  replicaCount: 1

  notificationBinding:
    # Default url: "http://mockoon:3001/api/notification/send"
    url: ""
    
  image:
    repository: ghcr.io/burgan-tech/vnext/execution
    tag: ""  # Defaults to chart appVersion
    digest: ""  # Image digest for immutable reference
    pullPolicy: ""  # Uses global.imagePullPolicy if empty
  
  # Override global settings if needed
  imagePullSecrets: []
  
  # The port Execution's own Kestrel process listens on for its second, gRPC-only h2c
  # endpoint (the proxy-mode TaskInvoker service) — see the Kestrel comment in
  # execution/BBT.Workflow.Execution.HttpApi.Host/Program.cs in the vnext runtime repo.
  #
  # Deliberately NOT a Dapr setting and NOT reused from dapr.appPort below: this is "what
  # port the app process binds", a fact about the app that holds regardless of whether
  # the sidecar is pointed at it. dapr.appPort is a DIFFERENT fact — "what port the
  # sidecar dials" — and must equal execution.service.port (5000) while dapr.protocol is
  # "http", or this value while dapr.protocol is "grpc". Collapsing the two into one
  # value is exactly the bug this comment exists to prevent: with dapr.protocol "http"
  # (the default), dapr.appPort is 5000, the SAME as execution.service.port/
  # ASPNETCORE_URLS's HTTP/1.1 port — if Kestrel__GrpcPort had also read dapr.appPort, the
  # app would try to bind port 5000 twice (once Http1, once Http2) and crash-loop with an
  # address-in-use IOException at startup. Sourced verbatim into both Kestrel__GrpcPort
  # (configmap.yaml) and the container's second containerPort (deployment.yaml), so the
  # app's actual gRPC listener and the pod spec can't drift apart from each other — but
  # NEVER into dapr.appPort; that one is the operator's job to flip, see below. Matches
  # local dev's Kestrel:GrpcPort (4212, alongside HTTP 4202 — also two distinct ports).
  grpcPort: "5001"

  # Dapr specific annotations
  dapr:
    enabled: true
    # appId doesn't exist in the values.yaml file, it is generated by the chart
    appId: ""
    # Default (this state): "http", matching global.dapr.protocol — the default
    # deployment must be byte-equivalent to before the gRPC proxy-mode transport existed
    # at all: HTTP/1.1 invocation, one whole trace.
    #
    # Execution also serves a second, gRPC-only h2c Kestrel endpoint on execution.grpcPort
    # above (the proxy-mode TaskInvoker service) alongside its normal HTTP/1.1 endpoint on
    # execution.service.port — see the Kestrel comment in
    # execution/BBT.Workflow.Execution.HttpApi.Host/Program.cs in the vnext runtime repo.
    # The gRPC containerPort (deployment.yaml) and Kestrel__GrpcPort (configmap.yaml) stay
    # wired to execution.grpcPort regardless of this value — the app can serve that port
    # harmlessly while the sidecar isn't pointed at it. This value, not those, is the
    # actual switch.
    #
    # To enable gRPC proxy-mode invocation, set ALL of the following together — a
    # partial flip breaks every task invocation, not just tracing:
    #   1. This value: "grpc"
    #   2. appPort below: the SAME number as execution.grpcPort above (not repeated here
    #      so the two can't drift — read execution.grpcPort's value and copy it)
    #   3. orchestrator.appEnvConfig.ExecutionApi__Transport (below, in this same file):
    #      "grpc"
    # Known cost, disclosed here because an operator flipping this needs to see the
    # trade at the value, not go find it: enabling gRPC proxy mode currently BREAKS
    # distributed trace continuity. Dapr's AppCallback hop delivers a duplicated,
    # W3C-invalid `traceparent`, so Execution roots a fresh trace instead of continuing
    # the caller's — each invocation produces two disconnected traces, not one. See
    # docs/runtime/dapr-invocation-transport.md in the vnext runtime repo.
    protocol: "http"
    # dapr.io/app-port — MUST be the port that protocol above actually serves, not
    # execution.service.port and NOT execution.grpcPort verbatim (they only coincide when
    # protocol is grpc). Execution binds two cleartext ports because Kestrel cannot
    # multiplex HTTP/1.1 (MVC controller, health probes, swagger — see service.port and
    # the probes below) and HTTP/2-only gRPC on one: there's no ALPN without TLS, and
    # Kestrel does not byte-sniff the HTTP/2 preface to auto-upgrade — it silently
    # downgrades the shared endpoint to HTTP/1.1 instead.
    #
    # Default (this state): "5000", the HTTP/1.1 port — same as execution.service.port.
    # This is a DIFFERENT config key from execution.grpcPort above on purpose: if this
    # value instead read execution.grpcPort's default (5001) while protocol is "http", or
    # if Kestrel__GrpcPort read this key instead of its own, the app would try to bind the
    # same port twice (Http1 and Http2) and crash-loop at startup with an address-in-use
    # error — that coupling is exactly what regressed once already; do not reintroduce it.
    #
    # When protocol above is "grpc", this MUST become execution.grpcPort's value (5001 by
    # default, i.e. service.port + 1) — matches local dev's Kestrel:GrpcPort (4212
    # alongside HTTP 4202).
    appPort: "5000"
    # Override global.dapr.httpMaxRequestSize for this component. Empty = use global.
    httpMaxRequestSize: ""

  podAnnotations:
    dapr.io/config: appconfig
  podLabels: {}
  podSecurityContext: {}
  
  # Use global securityContext, override if needed
  securityContext: {}
  
  # HTTP/1.1 port ONLY (MVC controller, health probes, swagger). Deliberately NOT the
  # gRPC port, even when dapr.protocol above is switched to "grpc" — the K8s Service and
  # both probes below speak HTTP/1.1 and would fail against the HTTP/2-only gRPC
  # listener. The gRPC port lives at execution.grpcPort above (a fixed app-listener fact,
  # independent of dapr.protocol/appPort) and is exposed as a second containerPort in
  # deployment.yaml, not through this Service (the sidecar reaches it over localhost).
  service:
    type: ClusterIP
    port: 5000

  # Uses global.resources.default if empty
  resources: {}

  # Health check probes (uses global.probes if not specified). MUST stay on the "http"
  # named port (service.port) — probes speak HTTP/1.1 and the gRPC port is HTTP/2-only.
  livenessProbe:
    httpGet:
      path: /live
      port: http

  readinessProbe:
    httpGet:
      path: /ready
      port: http
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Additional environment variables for the execution service
  extraEnvConfig: {}
  
  # Application configuration
  appEnvConfig:
    # If Vault is enabled, the database and redis configurations won't be created in the configmap.
    Vault__Enabled: "true"
    Logging__LogLevel__Default: "Debug"

