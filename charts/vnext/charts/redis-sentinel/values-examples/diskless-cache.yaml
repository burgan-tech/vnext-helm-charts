# redis-sentinel: pure cache, no persistence (persistenceMode: diskless)
#
# REWRITTEN in 1.3.0. This file used to be a copy of the external-access example with
# only `appendonly: false` changed - it still set persistence.enabled: true, so the
# template emitted save points and it was really a PVC-backed, snapshotting Redis. Its
# name has been wrong since it was created.
#
# READ THIS BEFORE USING IT. diskless is riskier in a Sentinel pair than in a sharded
# cache: a master that restarts faster than sentinel.downAfterMilliseconds is never
# marked down, so it comes back EMPTY and the replicas full-resync FROM EMPTY - the
# WHOLE dataset, not one shard's worth. gracefulShutdown below is what prevents that on
# planned restarts; nothing prevents it on an OOMKill or a node loss.

replicaCount: 3

image:
  registry: docker.io
  repository: redis
  pullPolicy: IfNotPresent
  tag: "8.8.0-alpine"

auth:
  existingSecret: ""

redis:
  password: ""
  port: 6379

  persistenceMode: diskless
  # -> io-threads. "auto" derives max(1, min(cores - 2, 8)) from the container CPU
  # limit, so it follows resources.limits.cpu instead of going stale when you change
  # it. Below 4 cores it correctly derives to nothing - adding threads to a one- or
  # two-core CFS quota only buys throttling.
  #
  # Set here rather than as a chart default because io-threads is NOT
  # runtime-modifiable: defaulting it on would restart every existing release AND
  # change how it schedules work, in an upgrade meant to be routine. A new install
  # from this file gets it; an existing release is never changed behind its back.
  ioThreads: "auto"


  # maxMemory is deliberately NOT pinned: it is derived from
  # resources.limits.memory x redis.maxMemoryRatio, which the declared mode
  # sets (0.8 for diskless, 0.6 for a durable mode - the durable one leaves
  # room for the fork an AOF rewrite or BGSAVE does, where copy-on-write can
  # push the child's RSS well above the parent's).
  #
  # Pinning it is the mistake to avoid here: redis.maxMemory WINS over the
  # ratio, so raising resources.limits.memory would then change nothing and
  # nothing in the rendered config would say so. Set the LIMIT, not this.
  maxMemoryPolicy: "allkeys-lru"

  # PVC kept, and deliberately.
  #
  # "diskless" is about the DATASET - persistence.enabled is about storage, and the two
  # are different questions (that confusion is most of what 1.3.0 exists to fix). The
  # volume here holds Sentinel's own rewritten config, which records who the current
  # master is; keeping it means a restarted pod comes back already knowing.
  #
  # There is also a hard practical reason not to change it: volumeClaimTemplates is
  # IMMUTABLE. Removing the PVC - or even shrinking it - makes `helm upgrade` fail
  # outright for anyone already running this example, which used to provision 8Gi.
  # So 8Gi it stays. It is more than Sentinel's config needs; the alternative is
  # breaking every existing adopter, which is worse than a mostly-empty volume.
  persistence:
    enabled: true
    size: 8Gi

  # Was hand-written into extraConfig. First-class now, and rendered
  # BEFORE extraConfig - so anything you add there still wins.
  network:
    tcpKeepalive: 60

  extraConfig: |
    # Nothing here: every line this example used to carry was either a
    # Redis default written out, or is a first-class value now.
sentinel:
  quorum: 2                     # (replicaCount / 2) + 1
  downAfterMilliseconds: 30000
  failoverTimeout: 180000
  parallelSyncs: 1

# Hand mastership over before a planned stop. Without it, diskless is a data-loss trap
# (see the header).
gracefulShutdown:
  enabled: true
  failoverTimeout: 20
terminationGracePeriodSeconds: 60

resources:
  redis:
    limits:
      cpu: 1000m
      memory: 3Gi
    requests:
      cpu: 100m
      memory: 100Mi
  sentinel:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

openshift:
  enabled: true

metrics:
  enabled: true
  image:
    registry: docker.io
    repository: oliver006/redis_exporter
    tag: v1.79.0
