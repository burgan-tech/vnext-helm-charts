{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "redis-sentinel.fullname" . }}
  labels:
    {{- include "redis-sentinel.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "redis-sentinel.selectorLabels" . | nindent 6 }}
      {{- /* component narrows this to the StatefulSet's pods. The chart's Job pods
           carry the same name+instance labels, and a COMPLETED job pod is not Ready
           yet still counts toward the PDB's expected total - which takes
           allowed-disruptions to 0 and blocks node drains. */}}
      app.kubernetes.io/component: redis
{{- end }}

