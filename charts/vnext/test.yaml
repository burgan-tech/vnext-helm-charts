# Source: vnext/templates/common/common-dapr-components/resiliency-cross-domain.yaml
# Cross-domain service-invocation resiliency for the ORCHESTRATOR sidecar only — cross-domain traffic
# is orchestrator → orchestrator (a domain never invokes another domain's execution host or workers).
#
# Rendered unconditionally. It needs no list of remote domains: the policies below use Dapr's
# RESERVED default names (Default<Target><Kind>Policy), which apply to every service-invocation
# target that has no more specific policy of its own. The orchestrator's only other Dapr target,
# its execution host, keeps the explicit policies in resiliency-orchestration.yaml — a named target
# always wins over a default — so this file effectively governs cross-domain calls only.
#
# Resiliency targets are keyed by the app-id WITHOUT its namespace (daprd splits
# `vnext-credit-app.preprod-vnext-credit` first, then looks the policy up by `vnext-credit-app`), so
# an optional per-domain entry in global.dapr.crossDomainTargets is written as `vnext-<domain>-app`.
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: vnext-cross-domain-resiliency
  labels:
    helm.sh/chart: vnext-1.0.122
    app.kubernetes.io/name: vnext
    app.kubernetes.io/instance: contract
    app.kubernetes.io/version: "0.0.99"
    app.kubernetes.io/managed-by: Helm
scopes:
- "vnext-core-app"
spec:
  policies:
    circuitBreakers:
      # Fast-fail a remote domain that is down instead of stacking per-call timeouts. Mirrors
      # invocationBreaker in resiliency-orchestration.yaml deliberately: same shape, same reasoning.
      # Reserved name ⇒ applies to every app target not naming its own breaker.
      DefaultAppCircuitBreakerPolicy:
        maxRequests: 1
        timeout: 30s
        trip: consecutiveFailures >= 5
    retries:
      # An explicit NO-OP retry under the reserved default name. This exists to PIN behaviour:
      # without it, a cluster-wide default or a future edit could silently reintroduce retries on
      # mutating cross-domain calls (instances/start, internal/subflow-forward, transitions/{key},
      # sub/*, busy, child-cancel, complete, longpoll/ack). Those are side-effecting and must be
      # attempted exactly once by the transport; a duplicate start or subflow-forward is data
      # corruption, not a slow call.
      #
      # Why retry cannot be scoped to the safe half here: a Resiliency target is an APP-ID, a
      # domain's reads and mutations share one app-id (vnext-{domain}-app), and `retry.matching`
      # filters by HTTP status code, not by path or method. Read-side retry therefore lives in the
      # app (Polly, on the Read-profile typed clients only) — see RemoteServiceExtensions and
      # RemoteServiceProfile in the runtime repo. Same conclusion as resiliency-orchestration.yaml.
      DefaultAppRetryPolicy:
        policy: constant
        duration: 1s
        maxRetries: 0
  # spec.targets is REQUIRED by the Resiliency CRD even when empty — omitting it fails the apply
  # with "spec.targets: Required value". The default policies above need no target entry, so an
  # empty `apps: {}` is the correct rendering when no explicit per-domain targets are listed.
  targets:
    apps: {}
---
# Source: vnext/templates/common/common-dapr-components/resiliency-inbox.yaml
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: vnext-inbox-resiliency
# Loaded by the worker-inbox sidecar only.
scopes:
- "vnext-core-worker-inbox-app"
spec:
  policies:
    circuitBreakers:
      # When Orchestration is down, fail forwards fast and let the inbox's bounded redelivery
      # + dead-letter own durability instead of stacking 60s timeouts. The breaker only
      # short-circuits; it never re-sends a forward.
      invocationBreaker:
        maxRequests: 1
        timeout: 30s
        trip: consecutiveFailures >= 5
  targets:
    apps:
      # Inbox worker → Orchestration internal forwards (subflow lifecycle, transition
      # continuations).
      #
      # NO retry policy on purpose. The forwarder (DaprOrchestrationForwarder) already owns the
      # at-least-once contract at the message level: transient statuses (>= 500, 408, 429)
      # rethrow so the inbox re-delivers, permanent 4xx are dropped. A sidecar retry here would
      # both retry the permanent 4xx (delaying the forwarder's drop decision) and duplicate the
      # inbox's own redelivery of transient failures — cross-layer amplification. Dapr retry
      # also cannot tell an app error response from an unreachable-app failure by status code
      # (`matching.httpStatusCodes` filters by code, not origin; an empty set retries all HTTP
      # errors), so classification stays in the forwarder where the distinction is known.
      #
      # No timeout policy: OrchestrationApi:InvocationTimeoutSeconds (60s) owns the per-call budget.
      vnext-core-app:
        circuitBreaker: invocationBreaker
---
# Source: vnext/templates/common/common-dapr-components/resiliency-orchestration.yaml
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: vnext-orchestration-resiliency
# Loaded by the orchestrator (vnext-app) sidecar only.
scopes:
- "vnext-core-app"
spec:
  policies:
    circuitBreakers:
      # Fast-fail when the Execution host is down instead of burning the 60s per-task
      # invocation timeout N times inside the 300s job budget: 5 consecutive failures open
      # the circuit for 30s, then a single probe request decides whether to close it.
      # The breaker trips on connection failures and error responses alike, which is safe
      # (it only short-circuits; it never re-invokes a task).
      invocationBreaker:
        maxRequests: 1
        timeout: 30s
        trip: consecutiveFailures >= 5
  targets:
    apps:
      # Orchestration → Execution task invocation (RemoteInvokerService).
      #
      # NO retry policy on purpose. Dapr's service-invocation retry cannot distinguish an app
      # response (the task ran and returned e.g. 500/4xx — which may already have produced side
      # effects) from a transport failure (the sidecar never reached the app): both surface as
      # an HTTP status with no reliable marker, and `matching.httpStatusCodes` filters by code,
      # not by origin. A blanket retry would therefore re-invoke side-effecting tasks, and an
      # empty/absent matching set retries ALL HTTP errors (>= 400) — the opposite of what a task
      # invocation wants. So retry is owned entirely by the app layer: RemoteInvokerService turns
      # a transport failure into a task failure that the user-defined error boundary decides on.
      #
      # No timeout policy on purpose: legitimate task calls run for tens of seconds; the
      # app-level linked CTS (ExecutionApi:InvocationTimeoutSeconds, 60s) owns the per-call
      # budget inside the hierarchy: 60s invocation ⊂ 300s job budget ⊂ 330s chain lock lease
      # (validated at startup by WorkflowExecutionOptionsValidator).
      #
      # Cross-domain DirectTrigger targets have per-domain app-ids and cannot be enumerated
      # here; add a circuitBreaker target entry per known remote domain when deploying multi-domain.
      vnext-core-execution-app:
        circuitBreaker: invocationBreaker
---
