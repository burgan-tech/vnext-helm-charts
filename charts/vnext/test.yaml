# Source: vnext/charts/redis-sentinel/templates/configmap-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: contract-redis-sentinel-config
  labels:
    helm.sh/chart: redis-sentinel-1.3.0
    app.kubernetes.io/name: redis-sentinel
    app.kubernetes.io/namespace: default
    app.kubernetes.io/instance: contract
    app.kubernetes.io/version: "8.8.0"
    app.kubernetes.io/managed-by: Helm
data:
  redis.conf: |
    # Redis Configuration
    port 6379
    dir /data
    
    # Replication
    replica-read-only yes
    # persistence-mode: aof (source: derived from redis.persistence.enabled + redis.appendonly)
    # Persistence
    #
    # LEGACY LAYOUT, kept byte-for-byte because redis.persistenceMode is not
    # declared: the block stays here, before extraConfig, so extraConfig keeps the
    # last word on every directive below - which is what this release already
    # renders. Declare redis.persistenceMode to get the full per-mode surface
    # (aof-*, rdb*, stop-writes-on-bgsave-error, repl-diskless-*) emitted
    # authoritatively after extraConfig instead.
    save ""
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec

    # Memory Management
    # Before extraConfig on purpose: maxmemory and maxmemory-policy are the two
    # directives most likely to be pinned there, and that tuning keeps winning.
    maxmemory 798mb
    maxmemory-policy noeviction

    # Network
    # These were hardcoded, and the chart's own default extraConfig then overrode
    # two of them - it shipped `tcp-keepalive 60` against a template that wrote
    # 300, and `timeout 0` twice. The defaults below are the values that were
    # EFFECTIVE, so nothing changes; they are just no longer said twice.
    tcp-backlog 511
    timeout 0
    tcp-keepalive 60
    # Hard ceiling on concurrent client connections. Redis's own default is 10000;
    # this exists because every Dapr sidecar in the namespace opens a pool per Redis
    # component (state + pubsub + pubsub-broadcast + configuration + lock), so the
    # per-domain connection count scales with POD COUNT, not with traffic. Budget:
    # (pods) x (components) x global.dapr.redis.poolSize, plus failover reconnects.
    maxclients 2000

    # Logging
    loglevel notice

    # Extra configuration
    
    # Performance optimizations
    tcp-keepalive 60
    timeout 0
    # Disable persistence for better performance (adjust for production)
    appendonly no
    save ""
    stop-writes-on-bgsave-error no
    # Replication optimizations
    repl-diskless-sync yes
    appendfsync no
    repl-diskless-load on-empty-db
    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
    lazyfree-lazy-server-del yes
    lazyfree-lazy-user-del yes
    replica-lazy-flush yes
    
  
  sentinel.conf: |
    # Sentinel Configuration
    port 26379
    # Unconditional /data.
    #
    # This used to be /tmp when persistence was disabled - but /tmp is NOT a mounted
    # volume in the sentinel container (it mounts /data, /config, /scripts,
    # /secrets), so Sentinel was rewriting its config onto the container root
    # filesystem, which breaks under any securityContext with
    # readOnlyRootFilesystem: true. /data is mounted in both cases (a PVC when
    # persistence.enabled, an emptyDir otherwise), so nothing durable moves: state
    # that lived in /tmp was already lost on every restart.
    dir /data
    
    # Master monitoring will be configured at runtime by init script
    # sentinel monitor mymaster <master-host> 6379 2
    
    # Timeouts
    sentinel down-after-milliseconds mymaster 30000
    sentinel failover-timeout mymaster 180000
    sentinel parallel-syncs mymaster 1
    
    # Enable hostname resolution
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    
    # Extra configuration
    
    # Custom Sentinel configuration
---
# Source: vnext/charts/redis-sentinel/templates/configmap-scripts.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: contract-redis-sentinel-scripts
  labels:
    helm.sh/chart: redis-sentinel-1.3.0
    app.kubernetes.io/name: redis-sentinel
    app.kubernetes.io/namespace: default
    app.kubernetes.io/instance: contract
    app.kubernetes.io/version: "8.8.0"
    app.kubernetes.io/managed-by: Helm
data:
  start-redis.sh: |
    #!/bin/sh
    set -e
    
    # Load Redis password from environment (injected from Secret)
    # REDIS_PASSWORD is used for Redis authentication
    
    # Get pod ordinal
    HOSTNAME=$(hostname)
    POD_INDEX="${HOSTNAME##*-}"
    
    # Copy base config
    cp /config/redis.conf /data/redis.conf
    
    # Add authentication
    if [ -n "$REDIS_PASSWORD" ]; then
      echo "requirepass $REDIS_PASSWORD" >> /data/redis.conf
      echo "masterauth $REDIS_PASSWORD" >> /data/redis.conf
    fi
    
    # ============================================================
    # WHO IS THE MASTER?
    # ============================================================
    # This used to be "pod-0 is the master, everyone else is a replica of pod-0",
    # unconditionally, on every start. That is only true on a fresh install.
    #
    # After a failover the master is some other ordinal - and a restarted pod-0 came
    # back as a SECOND MASTER holding an old but entirely plausible dataset. It
    # accepts writes for as long as it takes Sentinel to notice and demote it, and
    # those writes are then discarded by the full resync. Silent data loss on nothing
    # more than a pod restart of the wrong ordinal.
    #
    # start-sentinel.sh already contains exactly the discovery this needs, so ask any
    # reachable Sentinel who the master is - for EVERY ordinal, not just non-zero
    # ones. When no Sentinel answers we are a fresh install, and the pod-0 rule below
    # is the correct answer as well as the historical one.
    scli_at() {
      _sh=$1; shift
      if [ -n "$SENTINEL_PASSWORD" ]; then
        redis-cli -h "$_sh" -p 26379 -a "$SENTINEL_PASSWORD" --no-auth-warning "$@"
      else
        redis-cli -h "$_sh" -p 26379 --no-auth-warning "$@"
      fi
    }
    rcli_at() {
      _h=$1; _p=$2; shift 2
      redis-cli -h "$_h" -p "$_p" -a "$REDIS_PASSWORD" --no-auth-warning "$@"
    }

    MY_FQDN="contract-redis-sentinel-${POD_INDEX}.contract-redis-sentinel-headless.default.svc.cluster.local"
    MY_IP=$(hostname -i 2>/dev/null | awk '{print $1}')
    POD0_FQDN="contract-redis-sentinel-0.contract-redis-sentinel-headless.default.svc.cluster.local"

    MASTER_HOST=""
    MASTER_PORT=""
    for i in $(seq 0 $((3 - 1))); do
      OTHER="contract-redis-sentinel-${i}.contract-redis-sentinel-headless.default.svc.cluster.local"
      ADDR=$(scli_at "$OTHER" SENTINEL get-master-addr-by-name mymaster 2>/dev/null | tr '\r\n' '  ')
      H=$(echo "$ADDR" | awk '{print $1}')
      P=$(echo "$ADDR" | awk '{print $2}')
      if [ -n "$H" ] && [ -n "$P" ]; then
        MASTER_HOST="$H"
        MASTER_PORT="$P"
        echo "Sentinel on pod-$i reports the master is $MASTER_HOST:$MASTER_PORT"
        break
      fi
    done

    # ------------------------------------------------------------------
    # Sentinel says WHO the master is. It does not get to say how we reach it.
    # ------------------------------------------------------------------
    # Replication must use the in-cluster FQDN, always, and the address Sentinel
    # reports is not one:
    #
    #   a pod IP    Sentinel learns replicas from the master's INFO replication,
    #               which lists IPs, so after a failover it reports the new master
    #               by IP. Pinning `replicaof <pod IP>` survives exactly until that
    #               pod is recreated - measured on a live rolling restart, where a
    #               replica spent minutes on "Timeout connecting to the MASTER
    #               10.194.74.56:6379" for a pod that no longer existed, could not
    #               recover on its own because replicaof holds a literal address,
    #               and stayed NotReady long enough to fail the external-access
    #               restart job and with it the whole helm upgrade.
    #
    #   an external LoadBalancer IP or nodeHost:nodePort, once externalAccess is
    #               announcing. Replication would then leave the cluster and come
    #               back in through the router, which works and is absurd: it
    #               depends on an ingress path for traffic between two pods in the
    #               same namespace.
    #
    # A pod FQDN survives every IP change and never leaves the cluster, so map
    # whatever Sentinel said onto one. Each branch below uses something the chart
    # knows at render time; the probe is the fallback when none of them match.
    master_fqdn_of() {
      _mf_ord=""

      # Already one of ours: the first DNS label ends with the ordinal.
      if [ -z "$_mf_ord" ]; then
        case "${1%%.*}" in
          contract-redis-sentinel-*)
            _mf_ord="${1%%.*}"; _mf_ord="${_mf_ord##*-}" ;;
        esac
      fi

      # Nothing matched - most likely a bare pod IP. Ask each pod directly which one
      # is the master. This is also the branch that saves us when the address
      # Sentinel reported is DEAD: probing finds the pod that is actually serving.
      if [ -z "$_mf_ord" ]; then
        for _mf_i in $(seq 0 $((3 - 1))); do
          _mf_f="contract-redis-sentinel-${_mf_i}.contract-redis-sentinel-headless.default.svc.cluster.local"
          _mf_r=$(rcli_at "$_mf_f" 6379 INFO replication 2>/dev/null \
                    | grep '^role:' | cut -d: -f2 | tr -d '\r\n ')
          if [ "$_mf_r" = "master" ]; then
            _mf_ord=$_mf_i
            break
          fi
        done
      fi

      case "$_mf_ord" in
        ''|*[!0-9]*) return 1 ;;
      esac
      printf '%s-%s.%s.%s.svc.cluster.local' \
        "contract-redis-sentinel" "$_mf_ord" \
        "contract-redis-sentinel-headless" "default"
    }

    if [ -n "$MASTER_HOST" ]; then
      MAPPED=$(master_fqdn_of "$MASTER_HOST" "$MASTER_PORT")
      if [ -n "$MAPPED" ]; then
        if [ "$MAPPED" != "$MASTER_HOST" ] || [ "$MASTER_PORT" != "6379" ]; then
          echo "Replicating from the in-cluster address instead: $MAPPED:6379"
        fi
        MASTER_HOST="$MAPPED"
        MASTER_PORT=6379
      else
        # Never end up worse than before: if the address cannot be mapped, use it as
        # given. That is today's behaviour, with a line saying why it is fragile.
        echo "WARNING: could not map $MASTER_HOST:$MASTER_PORT to a pod - replicating from it as-is."
        echo "  If that address is a pod IP it will break when the pod is recreated."
      fi
    fi

    if [ -z "$MASTER_HOST" ]; then
      echo "No Sentinel answered - treating this as a fresh install (pod-0 is master)"
      if [ "$POD_INDEX" = "0" ]; then
        MASTER_HOST="$MY_IP"
      else
        MASTER_HOST="$POD0_FQDN"
      fi
      MASTER_PORT=6379
    fi

    # Sentinel reports the master by the address it monitors, normally an IP, so
    # compare against every identity this pod can legitimately be known by.
    AM_I_MASTER=no
    for mine in "$MY_IP" "$MY_FQDN" "${ANNOUNCE_IP:-}"; do
      [ -n "$mine" ] || continue
      [ "$MASTER_HOST" = "$mine" ] && AM_I_MASTER=yes
    done

    if [ "$AM_I_MASTER" = "yes" ]; then
      echo "Starting as master (pod-$POD_INDEX is the current master)"
    else
      echo "Starting as replica of $MASTER_HOST:$MASTER_PORT (pod-$POD_INDEX)"
      echo "replicaof $MASTER_HOST $MASTER_PORT" >> /data/redis.conf

      echo "Waiting for master to be ready..."
      until rcli_at "$MASTER_HOST" "$MASTER_PORT" ping > /dev/null 2>&1; do
        echo "Master not ready, waiting..."
        sleep 2
      done
      echo "Master is ready!"
    fi
    
    echo "Starting Redis server..."
    exec redis-server /data/redis.conf
  
  start-sentinel.sh: |
    #!/bin/sh
    set -e
    
    # Load passwords from environment (injected from Secret)
    # REDIS_PASSWORD - for authenticating with Redis
    # SENTINEL_PASSWORD - for Sentinel's own authentication
    
    # Get pod ordinal
    HOSTNAME=$(hostname)
    POD_INDEX="${HOSTNAME##*-}"
    
    # Copy base sentinel config
    cp /config/sentinel.conf /data/sentinel.conf
    
    # Add Redis password for Sentinel to authenticate with Redis master/replicas
    if [ -n "$REDIS_PASSWORD" ]; then
      echo "sentinel auth-pass mymaster $REDIS_PASSWORD" >> /data/sentinel.conf
    fi
    
    # Add Sentinel password for clients to authenticate with Sentinel
    if [ -n "$SENTINEL_PASSWORD" ]; then
      echo "requirepass $SENTINEL_PASSWORD" >> /data/sentinel.conf
    fi
    
    # Wait for local Redis to be ready
    echo "Waiting for local Redis to be ready..."
    until redis-cli -h 127.0.0.1 -p 6379 -a "$REDIS_PASSWORD" ping 2>/dev/null; do
      echo "Local Redis not ready, waiting..."
      sleep 2
    done
    echo "Local Redis is ready!"
    
    # Determine current master by checking Sentinel or using pod-0 as default
    MASTER_HOST="contract-redis-sentinel-0.contract-redis-sentinel-headless.default.svc.cluster.local"
    
    # Ask the other Sentinels who the master is - EVERY ordinal, including pod-0.
    #
    # Two defects lived here, both already fixed in start-redis.sh, so this had drifted
    # into being the one place that still got it wrong:
    #
    #   `| head -1` kept only the HOST and threw the PORT away. Over NodePort the host is
    #   nodeHost - identical for every pod - so the port is the ONLY thing saying which
    #   pod is master. Discarding it made the monitor line fall back to pod-0's port. On a
    #   live test that was right by luck, because pod-0 happened to be the master; with
    #   the master on pod-1 or pod-2 a restarting Sentinel would have monitored a REPLICA
    #   as the master.
    #
    #   pod-0 was excluded from asking at all, so a pod-0 restarting into a cluster whose
    #   master is pod-2 monitored itself. start-redis.sh dropped that exclusion for
    #   exactly this reason and this script did not follow.
    #
    # Six near-identical redis-cli invocations (TLS on/off x authClients on/off x password
    # or not) are what let both rot here while the sibling script was corrected. scli_at
    # is the helper start-redis.sh already uses, so the two discover identically now.
    scli_at() {
      _sh=$1; shift
      if [ -n "$SENTINEL_PASSWORD" ]; then
        redis-cli -h "$_sh" -p 26379 -a "$SENTINEL_PASSWORD" --no-auth-warning "$@"
      else
        redis-cli -h "$_sh" -p 26379 --no-auth-warning "$@"
      fi
    }
    MASTER_PORT=""
    echo "Asking the other Sentinels who the master is..."
    for i in $(seq 0 $((3 - 1))); do
      [ "$i" = "$POD_INDEX" ] && continue
      OTHER_HOST="contract-redis-sentinel-$i.contract-redis-sentinel-headless.default.svc.cluster.local"
      ADDR=$(scli_at "$OTHER_HOST" SENTINEL get-master-addr-by-name mymaster 2>/dev/null | tr '\r\n' '  ')
      SM_HOST=$(echo "$ADDR" | awk '{print $1}')
      SM_PORT=$(echo "$ADDR" | awk '{print $2}')
      if [ -n "$SM_HOST" ] && [ -n "$SM_PORT" ]; then
        MASTER_HOST="$SM_HOST"
        MASTER_PORT="$SM_PORT"
        echo "Sentinel on pod-$i reports the master is $MASTER_HOST:$MASTER_PORT"
        break
      fi
    done

    # Configure Sentinel to monitor the master
    echo "sentinel monitor mymaster $MASTER_HOST 6379 2" >> /data/sentinel.conf
    
    echo "Starting Redis Sentinel..."
    exec redis-sentinel /data/sentinel.conf
  
  # LIVENESS. Deliberately PING only, in every mode.
  #
  # Redis answers PING while it replays an AOF/RDB from disk, and that is what makes
  # a PING-only liveness probe SAFE: a loading-aware liveness probe would restart a
  # pod that is legitimately loading a large dataset, and the restart starts the load
  # from scratch - an unbreakable crash loop exactly when the dataset is largest.
  # Readiness is where loading is caught. Do not "improve" this.
  health-check-redis.sh: |
    #!/bin/sh
    # No `set -e`: this script's exit code IS the probe result, so an unexpected
    # non-zero from anything other than the check itself must not be reported as
    # "unhealthy".
    rcli() {
      redis-cli -h 127.0.0.1 -p 6379 -a "$REDIS_PASSWORD" --no-auth-warning "$@"
    }
    rcli ping

  # READINESS. PING, then the dataset must be loaded, then - for a replica - the
  # link to its master must be up UNLESS the master itself is unreachable.
  readiness-check-redis.sh: |
    #!/bin/sh
    rcli() {
      redis-cli -h 127.0.0.1 -p 6379 -a "$REDIS_PASSWORD" --no-auth-warning "$@"
    }
    rcli_at() {
      _h=$1; _p=$2; shift 2
      redis-cli -h "$_h" -p "$_p" -a "$REDIS_PASSWORD" --no-auth-warning "$@"
    }
    scli() {
      if [ -n "$SENTINEL_PASSWORD" ]; then
        redis-cli -h 127.0.0.1 -p 26379 -a "$SENTINEL_PASSWORD" --no-auth-warning "$@"
      else
        redis-cli -h 127.0.0.1 -p 26379 --no-auth-warning "$@"
      fi
    }

    rcli ping > /dev/null 2>&1 || exit 1
    INFO=$(rcli INFO 2>/dev/null)
    if [ -z "$INFO" ]; then
      echo "INFO returned nothing - not ready"
      exit 1
    fi
    if echo "$INFO" | grep -q '^loading:1'; then
      PCT=$(echo "$INFO" | grep '^loading_loaded_perc:' | cut -d: -f2 | tr -d '\r\n ')
      ETA=$(echo "$INFO" | grep '^loading_eta_seconds:' | cut -d: -f2 | tr -d '\r\n ')
      echo "loading the dataset from disk (${PCT:-?}% done, eta ${ETA:-?}s) - cannot serve yet"
      exit 1
    fi
    if echo "$INFO" | grep -q '^async_loading:1'; then
      echo "async_loading in progress - cannot serve yet"
      exit 1
    fi
    if [ "$(echo "$INFO" | grep -c '^loading:0')" = "0" ]; then
      echo "INFO has no 'loading' field - cannot confirm the dataset is loaded, refusing"
      exit 1
    fi
    # A replica with a dead master link holds stale data and is not a valid failover
    # target, so during a rolling update the update must WAIT for it rather than move
    # on to the next pod.
    #
    # But redis-cluster's version of this check cannot be ported verbatim. There, a
    # replica with a dead link holds nothing and clients reach other shards. Here the
    # replica may be the LAST COPY of the data, and it is the only thing still able
    # to serve reads. Worse: when the master dies, EVERY replica reports link down at
    # once, so the naive check empties the Service for both the redis AND the sentinel
    # port - clients then cannot even reach Sentinel to learn the new master, for the
    # whole down-after-milliseconds + failover window. That is strictly worse than
    # doing nothing.
    #
    # So the link only counts against us when the master is actually REACHABLE, i.e.
    # when this pod is the problem:
    #
    #   role != slave                    -> Ready
    #   link up                          -> Ready
    #   link down, master reachable      -> NOT ready   (rollout waits for us)
    #   link down, master unreachable    -> Ready       (serve stale, replica-serve-stale-data)
    #
    # A Sentinel that does not answer is treated as "master unreachable", so the
    # probe fails OPEN rather than emptying the service.
    ROLE=$(echo "$INFO" | grep '^role:' | cut -d: -f2 | tr -d '\r\n ')
    if [ "$ROLE" = "slave" ]; then
      LINK=$(echo "$INFO" | grep '^master_link_status:' | cut -d: -f2 | tr -d '\r\n ')
      if [ "$LINK" != "up" ]; then
        MADDR=$(scli SENTINEL get-master-addr-by-name mymaster 2>/dev/null | tr '\r\n' '  ')
        MHOST=$(echo "$MADDR" | awk '{print $1}')
        MPORT=$(echo "$MADDR" | awk '{print $2}')
        if [ -n "$MHOST" ] && [ -n "$MPORT" ] && rcli_at "$MHOST" "$MPORT" ping > /dev/null 2>&1; then
          echo "replica link is '$LINK' while master $MHOST:$MPORT IS reachable - not ready"
          exit 1
        fi
        echo "replica link is '$LINK' but the master is not reachable either - staying Ready to serve stale reads"
      fi
    fi

  # STARTUP (optional, off by default - see probes.startup.enabled). PING plus the
  # loading gate, and deliberately WITHOUT the replication-link check: on a fresh
  # install no link exists yet, so including it would kill every replica once
  # failureThreshold ran out.
  startup-check-redis.sh: |
    #!/bin/sh
    rcli() {
      redis-cli -h 127.0.0.1 -p 6379 -a "$REDIS_PASSWORD" --no-auth-warning "$@"
    }
    rcli ping > /dev/null 2>&1 || exit 1
    INFO=$(rcli INFO 2>/dev/null)
    if [ -z "$INFO" ]; then
      echo "INFO returned nothing - not started"
      exit 1
    fi
    if echo "$INFO" | grep -q '^loading:1'; then
      PCT=$(echo "$INFO" | grep '^loading_loaded_perc:' | cut -d: -f2 | tr -d '\r\n ')
      ETA=$(echo "$INFO" | grep '^loading_eta_seconds:' | cut -d: -f2 | tr -d '\r\n ')
      echo "loading the dataset from disk (${PCT:-?}% done, eta ${ETA:-?}s) - cannot serve yet"
      exit 1
    fi
    if echo "$INFO" | grep -q '^async_loading:1'; then
      echo "async_loading in progress - cannot serve yet"
      exit 1
    fi
    if [ "$(echo "$INFO" | grep -c '^loading:0')" = "0" ]; then
      echo "INFO has no 'loading' field - cannot confirm the dataset is loaded, refusing"
      exit 1
    fi

  # Sentinel liveness AND readiness. PING only, deliberately.
  #
  # A Sentinel that cannot currently reach its master MUST stay Ready: it is a voting
  # member of the quorum, and it is the only way clients discover the new master.
  # Gating it on "knows a healthy master" would remove every Sentinel from discovery
  # at exactly the moment discovery matters.
  health-check-sentinel.sh: |
    #!/bin/sh
    # No `set -e` - the exit code is the probe result.
    scli() {
      if [ -n "$SENTINEL_PASSWORD" ]; then
        redis-cli -h 127.0.0.1 -p 26379 -a "$SENTINEL_PASSWORD" --no-auth-warning "$@"
      else
        redis-cli -h 127.0.0.1 -p 26379 --no-auth-warning "$@"
      fi
    }
    scli ping
---
