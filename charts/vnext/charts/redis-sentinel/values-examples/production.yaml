# Full Monitoring Configuration
# Enables both Redis metrics and Sentinel metrics

# OpenShift compatibility
openshift:
  enabled: true

replicaCount: 3

# Auto-generate passwords
redis:
  # Declared, not derived.
  persistenceMode: aof-rdb
  # -> io-threads. "auto" derives max(1, min(cores - 2, 8)) from the container CPU
  # limit, so it follows resources.limits.cpu instead of going stale when you change
  # it. Below 4 cores it correctly derives to nothing - adding threads to a one- or
  # two-core CFS quota only buys throttling.
  #
  # Set here rather than as a chart default because io-threads is NOT
  # runtime-modifiable: defaulting it on would restart every existing release AND
  # change how it schedules work, in an upgrade meant to be routine. A new install
  # from this file gets it; an existing release is never changed behind its back.
  ioThreads: "auto"


  password: ""
  persistence:
    enabled: true
    size: 10Gi

sentinel:
  password: ""
  quorum: 2

# Redis Exporter (Sidecar)
# Monitors: Redis data metrics (connections, memory, commands, etc.)
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  podAnnotations:
    enabled: false  # Use ServiceMonitor instead

# Sentinel Exporter (External Deployment)
# Monitors: Sentinel health metrics (master status, failover, sentinel health)
sentinelExporter:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  serviceMonitor:
    enabled: true
    interval: 30s
  podAnnotations:
    enabled: false  # Use ServiceMonitor instead

# Pod anti-affinity
# Pod anti-affinity configuration
# Leave as {} to use default soft anti-affinity with matchLabels
# The default automatically uses: app.kubernetes.io/instance and app.kubernetes.io/name
affinity: {}

# Security context
# For OpenShift compatibility, leave these empty to auto-assign UIDs/GIDs
# For standard Kubernetes, you can set specific values:
# runAsUser: 999
# runAsGroup: 999
# fsGroup: 999
securityContext:
  # The chart picks ONE of these two blocks based on openshift.enabled.
  # A flat runAsNonRoot/runAsUser here would be silently ignored - the templates
  # only read securityContext.kubernetes and securityContext.openshift.
  kubernetes:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  # Leave empty on OpenShift so the SCC assigns UIDs/GIDs automatically
  openshift: {}

