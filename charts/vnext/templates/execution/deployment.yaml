{{- if .Values.execution.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vnext.fullname" . }}-execution
  labels:
    {{- include "vnext.componentLabels" (dict "context" . "component" "execution") | nindent 4 }}
  {{- if .Values.dapr.enabled }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  {{- if not .Values.execution.autoscaling.enabled }}
  replicas: {{ .Values.execution.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vnext.componentSelectorLabels" (dict "context" . "component" "execution") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "vnext.daprAnnotations" (dict "dapr" .Values.execution.dapr "enabled" .Values.global.dapr.enabled "component" "execution" "appDomain" .Values.global.appDomain "globalProtocol" .Values.global.dapr.protocol "maxBodySize" (coalesce .Values.execution.dapr.maxBodySize .Values.global.dapr.maxBodySize) "httpMaxRequestSize" (coalesce .Values.execution.dapr.httpMaxRequestSize .Values.global.dapr.httpMaxRequestSize) "globalDapr" .Values.global.dapr) | nindent 8 }}
        {{- with .Values.execution.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        "checksum/config": {{ include (print $.Template.BasePath "/execution/configmap.yaml") . | sha256sum }}
        "checksum/runtime-config": {{ include (print $.Template.BasePath "/common/runtime-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "vnext.componentLabels" (dict "context" . "component" "execution") | nindent 8 }}
        {{- with .Values.execution.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (coalesce .Values.execution.imagePullSecrets .Values.global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vnext.serviceAccountName" . }}
      {{- with .Values.global.terminationGracePeriodSeconds }}
      {{/* Must cover the sidecar's block + graceful shutdown window — see values.yaml. */}}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.execution.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-execution
          image: {{ include "vnext.image" (dict "image" .Values.execution.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "vnext.imagePullPolicy" (dict "component" .Values.execution "global" .Values.global) }}
          envFrom:
            - configMapRef:
                name: {{ include "vnext.fullname" . }}-execution-config
          {{- $securityContext := include "vnext.securityContext" (dict "component" .Values.execution "global" .Values.global) }}
          {{- if $securityContext }}
          securityContext:
            {{- $securityContext | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.execution.service.port }}
              protocol: TCP
            # Dedicated HTTP/2-only port for the Dapr gRPC proxy-mode TaskInvoker surface.
            # Kestrel can't multiplex HTTP/1.1 and h2c on one cleartext port (see
            # execution.grpcPort in values.yaml for why), so this is a second listener, not
            # a rename of the one above. Sourced from execution.grpcPort, NOT
            # execution.dapr.appPort (the dapr.io/app-port annotation) -- that value is
            # protocol-dependent and equals execution.service.port (the "http" port above)
            # by default, which would make this a duplicate containerPort and crash the pod
            # at startup with an address-in-use error. dapr.io/app-port targets this port
            # only once an operator has moved it here explicitly (see values.yaml).
            - name: grpc
              containerPort: {{ .Values.execution.grpcPort }}
              protocol: TCP
          {{- if .Values.execution.livenessProbe }}
          livenessProbe:
            {{- include "vnext.livenessProbe" (dict "probe" .Values.execution.livenessProbe "global" .Values.global.probes.liveness) | nindent 12 }}
          {{- end }}
          {{- if .Values.execution.readinessProbe }}
          readinessProbe:
            {{- include "vnext.readinessProbe" (dict "probe" .Values.execution.readinessProbe "global" .Values.global.probes.readiness) | nindent 12 }}
          {{- end }}
          {{- $resources := include "vnext.resources" (dict "component" .Values.execution "global" .Values.global) }}
          {{- if $resources }}
          resources:
            {{- $resources | nindent 12 }}
          {{- end }}
          {{- $runtimeMount := include "vnext.runtimeConfig.volumeMount" . }}
          {{- if or .Values.execution.volumeMounts $runtimeMount }}
          volumeMounts:
            {{- with .Values.execution.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $runtimeMount }}{{- . | nindent 12 }}{{- end }}
          {{- end }}
      {{- $runtimeVol := include "vnext.runtimeConfig.volume" . }}
      {{- if or .Values.execution.volumes $runtimeVol }}
      volumes:
        {{- with .Values.execution.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $runtimeVol }}{{- . | nindent 8 }}{{- end }}
      {{- end }}
      {{- with .Values.execution.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.execution.affinity }}
      affinity:
        {{- toYaml .Values.execution.affinity | nindent 8 }}
      {{- else }}
      affinity:
        {{- include "vnext.defaultPodAntiAffinity" (dict "context" . "component" "execution") | nindent 8 }}
      {{- end }}
      {{- with .Values.execution.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
