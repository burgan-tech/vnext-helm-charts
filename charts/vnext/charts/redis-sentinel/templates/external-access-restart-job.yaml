{{- /*
  Renders only when externalAccess.restartJob.enabled is explicitly turned on. It is off
  by default because this chart's pods already announce correctly on their first boot -
  every announce value is a render-time constant and both config files are recreated from
  the ConfigMap on every boot, so a restart produces identical configuration. See the
  restartJob comment in values.yaml for the measurement.

  redis-cluster's copy of this job is NOT redundant - it gates the announce on nodes.conf
  and needs the second boot. Do not "align" the two.
*/ -}}
{{- if and .Values.externalAccess.enabled .Values.externalAccess.restartJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "redis-sentinel.fullname" . }}-restart-for-external-access
  labels:
    {{- include "redis-sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-access-enabler
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- if .Values.externalAccess.restartJob.helmHookTimeout }}
    "helm.sh/hook-timeout": "{{ .Values.externalAccess.restartJob.helmHookTimeout }}"
    {{- end }}
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "redis-sentinel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: external-access-enabler
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "redis-sentinel.serviceAccountName" . }}
      {{- if .Values.openshift.enabled }}
      {{- with .Values.securityContext.openshift }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else }}
      {{- with .Values.securityContext.kubernetes }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: restart-statefulset
        image: {{ include "redis-sentinel.jobImage" . }}
        {{- if .Values.openshift.enabled }}
        {{- with .Values.containerSecurityContext.openshift }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- else }}
        {{- with .Values.containerSecurityContext.kubernetes }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
        command:
          - /bin/bash
          - -c
          - |
            set -e
            
            echo "============================================"
            echo "External Access Enabler - StatefulSet Restart"
            echo "============================================"
            echo ""
            echo "This job restarts the StatefulSet to enable external IP announcement"
            echo "for Redis Sentinel after initialization is complete."
            echo ""
            
            STATEFULSET_NAME="{{ include "redis-sentinel.fullname" . }}"
            NAMESPACE="{{ .Release.Namespace }}"
            
            echo "Waiting for all pods to be ready..."
            
            # Wait for all pods to be ready (max 10 minutes)
            MAX_WAIT=600
            ELAPSED=0
            REPLICAS={{ .Values.replicaCount }}
            
            # readyReplicas alone is NOT enough: it is still equal to replicas at the very
            # START of a rollout, before the controller has terminated the first pod. Helm
            # runs post-upgrade hooks without waiting for the workload, so this job can
            # arrive exactly in that window - and would then delete pods while the
            # StatefulSet controller is deleting its own, taking down two at once.
            # currentRevision == updateRevision with updatedReplicas == replicas is what
            # actually means "no rollout in flight".
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              STS=$(kubectl get statefulset ${STATEFULSET_NAME} -n $NAMESPACE \
                -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.currentRevision}/{.status.updateRevision}' 2>/dev/null || echo "0/0//x")
              READY_PODS="${STS%%/*}"; REST="${STS#*/}"
              UPDATED="${REST%%/*}"; REST="${REST#*/}"
              CUR_REV="${REST%%/*}"; UPD_REV="${REST#*/}"

              if [ "$READY_PODS" = "$REPLICAS" ] && [ "$UPDATED" = "$REPLICAS" ] && [ "$CUR_REV" = "$UPD_REV" ]; then
                echo "✓ All ${REPLICAS} pods are ready and no rollout is in flight"
                break
              fi

              echo "Waiting... (${READY_PODS:-0}/${REPLICAS} ready, ${UPDATED:-0}/${REPLICAS} updated, rollout $([ "$CUR_REV" = "$UPD_REV" ] && echo settled || echo in-flight), ${ELAPSED}s / ${MAX_WAIT}s)"
              sleep 10
              ELAPSED=$((ELAPSED + 10))
            done
            
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "⚠ Warning: Not all pods became ready within timeout"
              echo "Proceeding with restart anyway..."
            fi
            
            echo ""
            echo "Restarting StatefulSet to enable external IP announcement..."
            echo ""
            
            # Delete every pod, highest ordinal first. This does NOT spare the master: the
            # loop still reaches pod-0, and whichever pod is master at that moment gets
            # deleted, which moves mastership. Reverse order only postpones it - and after
            # a failover the master is not pod-0 anyway. The preStop hook hands mastership
            # over first, so the move is graceful, not a data loss; it is still a move.
            for i in $(seq $(($REPLICAS - 1)) -1 0); do
              POD_NAME="${STATEFULSET_NAME}-${i}"
              echo "Restarting pod: $POD_NAME"
              
              kubectl delete pod $POD_NAME -n $NAMESPACE --grace-period=60
              
              # Wait for pod to be recreated and ready
              echo "Waiting for $POD_NAME to be ready..."
              kubectl wait --for=condition=ready pod/$POD_NAME -n $NAMESPACE --timeout={{ .Values.externalAccess.restartJob.podReadyTimeout }}s || {
                echo "⚠ Warning: Pod $POD_NAME did not become ready within {{ .Values.externalAccess.restartJob.podReadyTimeout }}s"
                echo "Continuing with next pod..."
              }
              
              # Delay between pod restarts
              sleep {{ .Values.externalAccess.restartJob.delayBetweenPods }}
            done
            
            echo ""
            echo "============================================"
            echo "✓ External Access Enabled Successfully!"
            echo "============================================"
            echo ""
            echo "All pods have been restarted with external IP announcement."
            echo "External clients can now connect via LoadBalancer IPs:"
            {{- $loadBalancerIPs := .Values.externalAccess.service.loadBalancerIPs }}
            {{- range $i, $ip := $loadBalancerIPs }}
            echo "  - Node {{ $i }}:"
            echo "    Redis:    {{ $ip }}:{{ $.Values.redis.port }}"
            echo "    Sentinel: {{ $ip }}:{{ $.Values.sentinel.port }}"
            {{- end }}
            echo ""
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
{{- end }}

