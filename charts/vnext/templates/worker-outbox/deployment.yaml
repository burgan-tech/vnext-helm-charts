{{- $workerOutbox := index .Values "worker-outbox" }}
{{- if $workerOutbox.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vnext.fullname" . }}-worker-outbox
  labels:
    {{- include "vnext.componentLabels" (dict "context" . "component" "worker-outbox") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  {{- if not $workerOutbox.autoscaling.enabled }}
  replicas: {{ $workerOutbox.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vnext.componentSelectorLabels" (dict "context" . "component" "worker-outbox") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "vnext.daprAnnotations" (dict "dapr" $workerOutbox.dapr "enabled" .Values.global.dapr.enabled "component" "worker-outbox" "appDomain" .Values.global.appDomain "globalProtocol" .Values.global.dapr.protocol "maxBodySize" (coalesce $workerOutbox.dapr.maxBodySize .Values.global.dapr.maxBodySize) "httpMaxRequestSize" (coalesce $workerOutbox.dapr.httpMaxRequestSize .Values.global.dapr.httpMaxRequestSize) "globalDapr" .Values.global.dapr) | nindent 8 }}
        {{- with $workerOutbox.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        "checksum/config": {{ include (print $.Template.BasePath "/worker-outbox/configmap.yaml") . | sha256sum }}
        "checksum/runtime-config": {{ include (print $.Template.BasePath "/common/runtime-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "vnext.componentLabels" (dict "context" . "component" "worker-outbox") | nindent 8 }}
        {{- with $workerOutbox.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (coalesce $workerOutbox.imagePullSecrets .Values.global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vnext.serviceAccountName" . }}
      {{- with .Values.global.terminationGracePeriodSeconds }}
      {{/* Must cover the sidecar's block + graceful shutdown window — see values.yaml. */}}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with $workerOutbox.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-worker-outbox
          image: {{ include "vnext.image" (dict "image" $workerOutbox.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "vnext.imagePullPolicy" (dict "component" $workerOutbox "global" .Values.global) }}
          envFrom:
            - configMapRef:
                name: {{ include "vnext.fullname" . }}-worker-outbox-config
          {{- $securityContext := include "vnext.securityContext" (dict "component" $workerOutbox "global" .Values.global) }}
          {{- if $securityContext }}
          securityContext:
            {{- $securityContext | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $workerOutbox.service.port }}
              protocol: TCP
          {{- if $workerOutbox.livenessProbe }}
          livenessProbe:
            {{- include "vnext.livenessProbe" (dict "probe" $workerOutbox.livenessProbe "global" .Values.global.probes.liveness) | nindent 12 }}
          {{- end }}
          {{- if $workerOutbox.readinessProbe }}
          readinessProbe:
            {{- include "vnext.readinessProbe" (dict "probe" $workerOutbox.readinessProbe "global" .Values.global.probes.readiness) | nindent 12 }}
          {{- end }}
          {{- $resources := include "vnext.resources" (dict "component" $workerOutbox "global" .Values.global) }}
          {{- if $resources }}
          resources:
            {{- $resources | nindent 12 }}
          {{- end }}
          {{- $runtimeMount := include "vnext.runtimeConfig.volumeMount" . }}
          {{- if or $workerOutbox.volumeMounts $runtimeMount }}
          volumeMounts:
            {{- with $workerOutbox.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $runtimeMount }}{{- . | nindent 12 }}{{- end }}
          {{- end }}
      {{- $runtimeVol := include "vnext.runtimeConfig.volume" . }}
      {{- if or $workerOutbox.volumes $runtimeVol }}
      volumes:
        {{- with $workerOutbox.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $runtimeVol }}{{- . | nindent 8 }}{{- end }}
      {{- end }}
      {{- with $workerOutbox.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $workerOutbox.affinity }}
      affinity:
        {{- toYaml $workerOutbox.affinity | nindent 8 }}
      {{- else }}
      affinity:
        {{- include "vnext.defaultPodAntiAffinity" (dict "context" . "component" "worker-outbox") | nindent 8 }}
      {{- end }}
      {{- with $workerOutbox.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
