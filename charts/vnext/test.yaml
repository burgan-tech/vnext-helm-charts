# Source: vnext/templates/common/monitoring-config/opentelemetry-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-config
  labels:
    helm.sh/chart: vnext-1.0.122
    app.kubernetes.io/name: vnext
    app.kubernetes.io/instance: contract
    app.kubernetes.io/version: "0.0.99"
    app.kubernetes.io/managed-by: Helm
    app: opentelemetry-collector
data:
  relay: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:

    exporters:
      debug:
        verbosity: detailed
      otlphttp/openobserve:
        endpoint: http://contract-vnext-openobserve:5080/api/default
