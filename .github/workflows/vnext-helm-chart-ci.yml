name: Helm Chart CI/CD

# ==============================================================================
# Triggers:
#   1. push/PR      → chart dosyaları değiştiğinde (lint + release)
#   2. dispatch      → burgan-tech/vnext yeni release çıktığında (appVersion güncelle + release)
#   3. workflow_dispatch → manuel tetikleme (versiyon tipi seçilebilir)
#
# Semantic Versioning:
#   - patch (varsayılan): her push ve app-release'de otomatik artar
#   - minor/major: sadece workflow_dispatch ile manuel seçilebilir
#
# Cross-repo Trigger Kurulumu:
#   burgan-tech/vnext repo'sunun release workflow'una şu step eklenmeli:
#
#   - name: Trigger Helm Chart Release
#     uses: peter-evans/repository-dispatch@v3
#     with:
#       token: ${{ secrets.HELM_CHARTS_PAT }}
#       repository: burgan-tech/vnext-helm-charts
#       event-type: app-release
#       client-payload: '{"app_version": "${{ github.event.release.tag_name }}"}'
#
#   Not: HELM_CHARTS_PAT, vnext-helm-charts repo'suna yazma yetkisi olan bir PAT olmalıdır.
#
# Branch Protection Bypass:
#   master branch'inde "require pull request" kuralı varsa, version bump commit'i
#   için aşağıdakilerden birini yapın:
#
#   A) Repository ruleset bypass list'ine github-actions[bot] ekleyin
#      Settings → Rules → Rulesets → Bypass list → github-actions[bot]
#
#   B) GitHub App kullanarak token oluşturun (branch protection bypass destekler)
#      Gerekli secret'lar: APP_ID ve APP_PRIVATE_KEY
#      App permissions: Contents (read/write), Metadata (read)
# ==============================================================================

on:
  push:
    branches: [master, main]
    paths:
      - "charts/vnext/**"
      - "!charts/vnext/docs/**"
      - "!charts/vnext/Dockerfile"
      - "!charts/vnext/.helmignore"
  pull_request:
    branches: [master, main]
    paths:
      - "charts/vnext/**"
      - "!charts/vnext/docs/**"
      - "!charts/vnext/Dockerfile"
      - "!charts/vnext/.helmignore"
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
    inputs:
      app_version:
        description: "New appVersion from vnext release (e.g. 0.0.39). Leave empty to keep current."
        required: false
        type: string
      version_bump:
        description: "Chart version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease_type:
        description: "Chart prerelease kanalı (none = stable). alpha/beta/rc → X.Y.Z-alpha.N"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
      prerelease_number:
        description: "Prerelease numarası (ör. 1 → 1.2.4-alpha.1). Her yeni alpha'da artır."
        required: false
        default: "1"
        type: string

concurrency:
  group: helm-chart-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  CHART_PATH: charts/vnext
  CHART_NAME: vnext

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Add dependency repositories
        run: |
          helm repo add dapr https://dapr.github.io/helm-charts/
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build ${{ env.CHART_PATH }}

      - name: Lint chart
        run: helm lint ${{ env.CHART_PATH }} --strict

      - name: Validate templates (default)
        run: |
          helm template test-release ${{ env.CHART_PATH }} \
            --namespace vnext \
            --debug > /dev/null

      - name: Validate templates (external services)
        run: |
          helm template test-release ${{ env.CHART_PATH }} \
            --namespace vnext \
            --set vault.enabled=false \
            --set global.externalVault.enabled=true \
            --set global.externalVault.address="https://vault.example.com:8200" \
            --set redis-sentinel.enabled=false \
            --set global.externalRedis.endpoint="redis.example.com:6379" \
            --set opentelemetry-collector.enabled=false \
            --set global.telemetry.external.enabled=true \
            --set global.telemetry.external.endpoint="http://otel.example.com:4317" \
            --debug > /dev/null

      - name: Validate templates (dev tools enabled)
        run: |
          helm template test-release ${{ env.CHART_PATH }} \
            --namespace vnext \
            --set pgAdmin.enabled=true \
            --set redisInsight.enabled=true \
            --set mockoon.enabled=true \
            --set openobserve.enabled=true \
            --debug > /dev/null

      - name: Validate templates (sizing profiles)
        run: |
          for p in nonprod low normal high; do
            echo "--- profiles/values-$p.yaml ---"
            helm template test-release ${{ env.CHART_PATH }} \
              --namespace vnext \
              -f ${{ env.CHART_PATH }}/profiles/values-$p.yaml \
              --debug > "/tmp/profile-$p.yaml"
          done

      - name: Assert nonprod profile still equals the chart default
        run: |
          # values-nonprod.yaml is documented as an explicit restatement of the chart's
          # own defaults; this is what keeps that promise true. The redis/sentinel
          # passwords are randAlphaNum per render, so they are excluded.
          helm template test-release ${{ env.CHART_PATH }} \
            --namespace vnext > /tmp/profile-default.yaml
          if ! diff <(grep -vE 'redis-password:|sentinel-password:' /tmp/profile-default.yaml) \
                    <(grep -vE 'redis-password:|sentinel-password:' /tmp/profile-nonprod.yaml); then
            echo "::error::profiles/values-nonprod.yaml has drifted from charts/vnext/values.yaml."
            echo "Update whichever is wrong, or move the change into a prod profile instead."
            exit 1
          fi
          echo "OK: nonprod profile == chart default"

      - name: Assert every Redis component carries a bounded connection pool
        run: |
          # Regression guard for the connection-pool fix: all four Redis-backed Dapr
          # components (state, pubsub, pubsub-broadcast, lock) must declare poolSize.
          # Without it go-redis sizes the pool from the NODE's core count and a
          # scaled-out domain exhausts Redis maxclients. Was five before
          # configuration.redis was deleted (no code calls the Configuration API).
          found=$(grep -c 'name: poolSize' /tmp/profile-normal.yaml || true)
          if [ "$found" -ne 4 ]; then
            echo "::error::expected poolSize on 4 Redis components, found $found"
            exit 1
          fi
          if grep -q 'configuration.redis' /tmp/profile-normal.yaml; then
            echo "::error::configuration.redis is back -- nothing calls the Dapr Configuration API"
            exit 1
          fi
          echo "OK: poolSize present on all 4 Redis components"

      - name: Assert Redis components are scoped, and the env matrix mirrors the scopes
        run: |
          # Scoping is what keeps the per-sidecar component count (and therefore the
          # Redis connection budget) down. An unscoped component is loaded by EVERY
          # sidecar in the namespace. This also catches the inverse failure: a host
          # holding a DAPR_*_STORE_NAME whose component its sidecar cannot serve,
          # which surfaces only at first use.
          helm template test-release ${{ env.CHART_PATH }} \
            --namespace vnext --set global.appDomain=demo > /tmp/scoped.yaml
          python3 - <<'EOF'
          import re, sys
          docs = open('/tmp/scoped.yaml').read().split('---')
          want_scopes = {
            'test-release-vnext-state':            ['vnext-demo-app','vnext-demo-execution-app'],
            'test-release-vnext-redis-lock':       ['vnext-demo-app','vnext-demo-db-migrator-app'],
            'test-release-vnext-pubsub':           ['vnext-demo-app','vnext-demo-execution-app',
                                                    'vnext-demo-worker-inbox-app','vnext-demo-worker-outbox-app'],
            'test-release-vnext-pubsub-broadcast': ['vnext-demo-app'],
          }
          want_env = {
            'test-release-vnext-orchestrator-config':  {'STATE','LOCK','PUBSUB'},
            'test-release-vnext-execution-config':     {'STATE','PUBSUB'},
            'test-release-vnext-worker-inbox-config':  {'PUBSUB'},
            'test-release-vnext-worker-outbox-config': {'PUBSUB'},
            'test-release-vnext-db-migrator-config':   {'LOCK'},
          }
          seen_s, seen_e, bad = {}, {}, []
          for b in docs:
              n = re.search(r'^  name: (\S+)$', b, re.M)
              if not n: continue
              if 'kind: Component' in b:
                  seen_s[n.group(1)] = re.findall(r'^- "(\S+)"$', b, re.M)
              if 'kind: ConfigMap' in b:
                  seen_e[n.group(1)] = set(re.findall(r'DAPR_(STATE|LOCK|PUBSUB)_STORE_NAME', b))
          for k, v in want_scopes.items():
              if seen_s.get(k) != v:
                  bad.append(f'scopes {k}: got {seen_s.get(k)} want {v}')
          for k, v in want_env.items():
              if seen_e.get(k) != v:
                  bad.append(f'env {k}: got {sorted(seen_e.get(k) or [])} want {sorted(v)}')
          sec = [k for k in seen_s if k.endswith('-secret')]
          for k in sec:
              if seen_s[k]:
                  bad.append(f'{k} must stay UNSCOPED (every component auth.secretStore); got {seen_s[k]}')
          txt = open('/tmp/scoped.yaml').read()
          for dead in ('DAPR_PUBSUB_BROADCAST_STORE_NAME', 'Redis__'):
              if dead in txt:
                  bad.append(f'{dead} is dead config and must not be emitted')
          if bad:
              for b_ in bad: print(f'::error::{b_}')
              sys.exit(1)
          print('OK: scopes and the DAPR_*_STORE_NAME env matrix mirror each other')
          EOF

  release:
    name: Version Bump, Package & Publish
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Determine version bump type
        id: bump
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ github.event.inputs.version_bump }}" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve appVersion
        id: app_version
        run: |
          CURRENT=$(grep '^appVersion:' ${{ env.CHART_PATH }}/Chart.yaml | awk '{print $2}' | tr -d '"')

          NEW_APP_VERSION=""
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            NEW_APP_VERSION="${{ github.event.client_payload.app_version }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NEW_APP_VERSION="${{ github.event.inputs.app_version }}"
          fi

          # Strip leading 'v' prefix if present (vnext tags are v0.0.38 format)
          NEW_APP_VERSION="${NEW_APP_VERSION#v}"

          if [[ -n "$NEW_APP_VERSION" ]]; then
            echo "version=$NEW_APP_VERSION" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "appVersion: $CURRENT → $NEW_APP_VERSION"
          else
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "appVersion: $CURRENT (unchanged)"
          fi

      - name: Bump chart version (semantic)
        id: chart_version
        run: |
          CURRENT=$(grep '^version:' ${{ env.CHART_PATH }}/Chart.yaml | awk '{print $2}')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          BUMP_TYPE="${{ steps.bump.outputs.type }}"
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          BASE_VERSION="$MAJOR.$MINOR.$PATCH"

          # Prerelease yalnızca workflow_dispatch + prerelease_type != none iken uygulanır.
          PRERELEASE_TYPE="${{ github.event.inputs.prerelease_type }}"
          IS_PRERELEASE="false"
          NEW_VERSION="$BASE_VERSION"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$PRERELEASE_TYPE" && "$PRERELEASE_TYPE" != "none" ]]; then
            NEW_VERSION="${BASE_VERSION}-${PRERELEASE_TYPE}.${{ github.event.inputs.prerelease_number }}"
            IS_PRERELEASE="true"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Chart version: $CURRENT → $NEW_VERSION (bump=$BUMP_TYPE, prerelease=$IS_PRERELEASE)"

      - name: Update Chart.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ steps.chart_version.outputs.version }}/" ${{ env.CHART_PATH }}/Chart.yaml

          if [[ "${{ steps.app_version.outputs.changed }}" == "true" ]]; then
            sed -i "s/^appVersion: .*/appVersion: \"${{ steps.app_version.outputs.version }}\"/" ${{ env.CHART_PATH }}/Chart.yaml
          fi

          echo "--- Updated Chart.yaml ---"
          head -6 ${{ env.CHART_PATH }}/Chart.yaml

      - name: Commit version bump
        if: steps.chart_version.outputs.is_prerelease != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CHART_PATH }}/Chart.yaml

          MSG="chore: bump chart version to ${{ steps.chart_version.outputs.version }}"
          if [[ "${{ steps.app_version.outputs.changed }}" == "true" ]]; then
            MSG="$MSG (appVersion: ${{ steps.app_version.outputs.version }})"
          fi

          git commit -m "$MSG [skip ci]"
          git push

      - name: Add dependency repositories
        run: |
          helm repo add dapr https://dapr.github.io/helm-charts/
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build ${{ env.CHART_PATH }}

      - name: Package chart
        run: helm package ${{ env.CHART_PATH }} --destination .helm-packages

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Push chart to GHCR (OCI)
        run: |
          helm push .helm-packages/${{ env.CHART_NAME }}-${{ steps.chart_version.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}

      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Add appVersion label to OCI artifact
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHART_NAME }}:${{ steps.chart_version.outputs.version }}"
          crane mutate "$IMAGE" \
            --annotation "org.opencontainers.image.appVersion=${{ steps.app_version.outputs.version }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}"

      - name: Generate release metadata
        run: |
          cat > .helm-packages/metadata.json <<EOF
          {
            "chartName": "${{ env.CHART_NAME }}",
            "chartVersion": "${{ steps.chart_version.outputs.version }}",
            "previousChartVersion": "${{ steps.chart_version.outputs.previous }}",
            "appVersion": "${{ steps.app_version.outputs.version }}",
            "appVersionChanged": ${{ steps.app_version.outputs.changed }},
            "bumpType": "${{ steps.bump.outputs.type }}",
            "trigger": "${{ github.event_name }}",
            "registry": "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHART_NAME }}",
            "commit": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.chart_version.outputs.version }}
          name: "vnext chart v${{ steps.chart_version.outputs.version }}"
          body: |
            ## vNext Helm Chart v${{ steps.chart_version.outputs.version }}

            | | |
            |---|---|
            | **Chart Version** | `${{ steps.chart_version.outputs.previous }}` → `${{ steps.chart_version.outputs.version }}` |
            | **App Version** | `${{ steps.app_version.outputs.version }}` |
            | **Bump Type** | `${{ steps.bump.outputs.type }}` |
            | **Trigger** | `${{ github.event_name }}` |

            ### Installation

            ```bash
            # OCI registry
            helm install vnext oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHART_NAME }} \
              --version ${{ steps.chart_version.outputs.version }} \
              -n vnext --create-namespace --timeout 20m

            # From release artifact
            helm install vnext ./vnext-${{ steps.chart_version.outputs.version }}.tgz \
              -n vnext --create-namespace --timeout 20m
            ```

            ### Upgrade

            ```bash
            helm upgrade vnext oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHART_NAME }} \
              --version ${{ steps.chart_version.outputs.version }} \
              -n vnext --timeout 20m -f my-values.yaml
            ```
          files: |
            .helm-packages/${{ env.CHART_NAME }}-${{ steps.chart_version.outputs.version }}.tgz
            .helm-packages/metadata.json
          generate_release_notes: true
          make_latest: ${{ steps.chart_version.outputs.is_prerelease != 'true' }}
          prerelease: ${{ steps.chart_version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
