# =============================================================================
# vNext sizing profile: HIGH  --  production, high-TPM domain
# =============================================================================
# Apply with:  helm upgrade --install <rel> oci://ghcr.io/burgan-tech/vnext/vnext \
#                -f profiles/values-high.yaml -f <your-domain-values>.yaml
#
# WHEN TO USE
# The few hottest domains only. Note the connection budget: at the HPA ceiling
# this profile can open ~10600 Redis connections per domain, which is why
# maxClients is raised to 20000 here.
#
# The chart's own defaults are NONPROD-sized (1 replica, 1 Redis node, no HPA), so
# every production install MUST pass one of low / normal / high.
#
# Measured baseline behind these numbers: bmprod/intprod-vnext-contract, 2026-09-09.
# See docs/SIZING_PROFILES.md for the full table and the reasoning.
# -----------------------------------------------------------------------------

global:
  # Deliberately EMPTY. One value cannot serve a ~530Mi orchestrator and a ~115Mi
  # outbox worker: it over-provisions the workers ~4x while leaving the orchestrator
  # requesting less than its measured RSS. Size per component instead (below).
  resources:
    default: {}

  dapr:
    # Redis client pool. Budget = pods x 5 components x poolSize, and it must stay
    # under redis-sentinel.redis.network.maxClients with room for the reconnect burst
    # that follows a Sentinel failover.
    #   floor  42 pods x 5 x 20 = 4200 connections
    #   ceiling106 pods x 5 x 20 = 10600 connections   (maxClients 20000)
    redis:
      poolSize: 20
      minIdleConns: 2
      idleTimeout: "5m"
      dialTimeout: "5s"
      readTimeout: "3s"
      writeTimeout: "3s"
      maxRetries: 3
      maxRetryBackoff: "2s"
      pubsub:
        concurrency: 20
        processingTimeout: "60s"
        redeliverInterval: "30s"
        queueDepth: 100
        # Caps stream length. maxmemory-policy is noeviction, so a Redis at maxmemory
        # REJECTS writes rather than evicting -- an unbounded stream behind a stalled
        # consumer would take the whole domain down with it.
        maxLenApprox: 10000

orchestrator:
  # HPA floor = the profile's replica count; `replicas` is omitted from the Deployment
  # whenever autoscaling is enabled, so Helm never fights the HPA.
  autoscaling:
    enabled: true
    minReplicas: 20
    maxReplicas: 40
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 3000m
      memory: 3Gi
  podAnnotations:
    dapr.io/config: appconfig
    # Sidecar sizing is an environment concern by chart design (see _helpers.tpl).
    # Measured daprd AT REST is only 0.6-2.0m CPU / 48-81Mi RSS, but that idle figure is
    # NOT what sizes this. The chart emits dapr.io/max-body-size: 64Mi, so ONE in-flight
    # body can add ~64Mi to the sidecar's working set, and this profile allows
    # 20 concurrent pub/sub handler invocations. So: the memory REQUEST is held above
    # baseline + one 64Mi body (or the sidecar becomes the first eviction candidate on a
    # pod that is on every request path), and the LIMIT covers several concurrent bodies.
    # daprd also now holds up to poolSize x 5 components Redis connections per sidecar.
    dapr.io/sidecar-cpu-request: 150m
    dapr.io/sidecar-cpu-limit: 1000m
    dapr.io/sidecar-memory-request: 256Mi
    dapr.io/sidecar-memory-limit: 768Mi
    # INTEGER seconds -- "20s" fails to parse. block + graceful must fit
    # global.terminationGracePeriodSeconds (60).
    dapr.io/graceful-shutdown-seconds: "20"
    dapr.io/block-shutdown-duration: 30s

