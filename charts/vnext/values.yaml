# ==============================================================================

postgres:
  enabled: true
  replicaCount: 1
  
  image:
    repository: docker.io/library/postgres
    tag: "18.0@sha256:073e7c8b84e2197f94c8083634640ab37105effe1bc853ca4d5fbece3219b0e8"
    imagePullPolicy: Always
  
  auth:
    existingSecret: ""
    secretKeys:
      passwordKey: "postgres-password"
    username: "admin"
    password: "admin"
    database: "vNext_WorkflowDb"
  
  podLabels: {}
  
  serviceAccount:
    autoMountServiceAccountToken: false
  
  service:
    port: 5432
    targetPort: 5432
    type: ClusterIP
    loadBalancerIP: ""
    externalTrafficPolicy: ""
  
  config:
    existingConfigmap: ""
    # PostgreSQL performance tuning
    postgresqlMaxConnections: 2048
    postgresqlSharedBuffers: 128MB
    postgresqlEffectiveCacheSize: 4GB
    postgresqlWorkMem: 4MB
    postgresqlMaintenanceWorkMem: 64MB
    postgresqlWalBuffers: 16MB
    postgresqlCheckpointCompletionTarget: 0.7
    postgresqlRandomPageCost: 1.1
    postgresqlLogStatement: "none"
    postgresqlLogMinDurationStatement: -1
    postgresqlSharedPreloadLibraries: ""
    pgHbaConfig: ""
    extraConfig: []
  
  # Security contexts (commented for flexibility)
  # podSecurityContext:
  #   fsGroup: 999
  # containerSecurityContext:
  #   allowPrivilegeEscalation: false
  #   runAsNonRoot: true
  #   runAsUser: 999
  #   runAsGroup: 999
  #   readOnlyRootFilesystem: false
  #   capabilities:
  #     drop:
  #       - ALL
  
  initContainers: []
  
  initdb:
    args: ""
    scripts: {}
    scriptsConfigMap: ""
    directory: "/docker-entrypoint-initdb.d/"
  
  extraEnvVars: []
  extraEnvVarsSecret: ""
  
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  
  resources: {}
  
  extraVolumes: []
  extraVolumeMounts: []
  
  metrics:
    image:
      registry: quay.io
      repository: prometheuscommunity/postgres-exporter
      tag: "v0.18.1@sha256:fb96c4413985d4b23ab02b19022b3d70a86c8e0a62f41ab15ebb6f4673781a5d"
      pullPolicy: Always
    
    resources: {}
  
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi
    existingClaim: ""
    annotations: {}
    accessModes:
      - ReadWriteOnce
  
  nodeSelector: {}
  affinity: {}
  tolerations: []

