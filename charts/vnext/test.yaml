# Source: vnext/templates/common/checker-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: contract-vnext-checker-job
  labels:
    app.kubernetes.io/name: contract-vnext-checker
    helm.sh/chart: vnext-1.0.122
    app.kubernetes.io/name: vnext
    app.kubernetes.io/instance: contract
    app.kubernetes.io/version: "0.0.99"
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: contract
    meta.helm.sh/release-namespace: default
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,post-delete
spec:
  template:
    spec:
      containers:
      - name: checker
        image: alpine/curl:8.14.1
        command:
        - /bin/sh
        - -c
        - |
          echo "Checking services..."
          while ! (curl -s http://contract-vnext-redis-sentinel-headless:9121/metrics | grep -qi "redis_up 1"); do echo "Redis DOWN" && sleep 5 ; done && echo "Redis UP"
          while ! (curl -s http://contract-vnext-postgres-headless:9187/metrics | grep -qi "pg_up 1"); do echo "Postgres DOWN" && sleep 5 ; done && echo "Postgres UP"
          while ! curl -s http://contract-vnext-vault:8200/v1/sys/health | grep -qi "\"initialized\":true"; do echo "Vault DOWN" && sleep 5 ; done && echo "Vault UP"
          while ! curl -s -o /dev/null http://dapr-api:9090/healthz; do echo "Dapr Operator DOWN" && sleep 5 ; done && echo "Dapr Operator UP"
          while ! curl -s -o /dev/null http://dapr-placement-server:9090/healthz; do echo "Dapr Placement DOWN" && sleep 5 ; done && echo "Dapr Placement Server UP"
          while ! curl -s -o /dev/null http://dapr-sidecar-injector:9090/healthz; do echo "Dapr Sidecar Injector DOWN" && sleep 5 ; done && echo "Dapr Sidecar Injector UP"
          while ! curl -s -o /dev/null http://dapr-scheduler-server:9090/healthz; do echo "Dapr Scheduler DOWN" && sleep 5 ; done && echo "Dapr Scheduler Server UP"
          while ! curl -s -o /dev/null http://dapr-sentry:9090/healthz; do echo "Dapr Sentry DOWN" && sleep 5 ; done && echo "Dapr Sentry Server UP"
          echo "Check complete"
      restartPolicy: Never
---
# Source: vnext/templates/common/vault-initializer/vault-initializer-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: contract-vnext-vault-initializer
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,post-delete
spec:
  template:
    spec:
      serviceAccountName: contract-vnext-vault-initializer
      containers:
        - name: vault-initializer
          image: ghcr.io/burgan-tech/vault-initializer:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Vault initializing status checking..."
              sleep 2
              until [ "$(curl -s $VAULT_ADDR/v1/sys/init | jq -r .initialized)" = "true" ] || [ "$(curl -s $VAULT_ADDR/v1/sys/init | jq -r .initialized)" = "false" ]; do
                echo "Vault initialization status unknown. Waiting for 5 seconds..."
                sleep 5
              done

              if [ "$(curl -s $VAULT_ADDR/v1/sys/init | jq -r .initialized)" = "true" ]; then
                echo "Vault already initialized. Skipping initialization..."
                exit 0
              fi
              
              curl -s $VAULT_ADDR/v1/sys/init -X POST -H "Content-Type: application/json" --data '{"secret_shares": 5,"secret_threshold": 3}' > /tmp/keys.json
              echo "Vault initialized"
              
              cat /tmp/keys.json | jq -r .keys_base64[] | xargs -I{} curl -s --request POST --data '{"key": "{}"}' $VAULT_ADDR/v1/sys/unseal
              echo "Vault unsealed"

              kubectl create secret generic vault-keys --from-file /tmp/keys.json
              echo "Vault keys secret created"
              
              ROOT_TOKEN=$(cat /tmp/keys.json | jq -r .root_token)
              kubectl get component contract-vnext-secret -o json \
                | jq --arg v "$ROOT_TOKEN" '
                  .spec.metadata |= map(
                    if .name == "vaultToken" then
                      .value = $v
                    else
                      .
                    end
                  )
                ' \
                | kubectl apply -f -

              ENGINE_CHECK=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$VAULT_ADDR/v1/sys/mounts/vnext-core-engine/tune" -H "X-Vault-Token: $ROOT_TOKEN")
              SECRET_CHECK=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$VAULT_ADDR/v1/vnext-core-engine/data/workflow-secret" -H "X-Vault-Token: $ROOT_TOKEN")
              
              if [ "$ENGINE_CHECK" -ne 200 ]; then
                curl -sX POST "$VAULT_ADDR/v1/sys/mounts/vnext-core-engine" \
                -H "Content-Type: application/json" \
                -H "X-Vault-Token: $ROOT_TOKEN" \
                -d '{
                  "type": "kv",
                  "options": {
                    "version": 2
                  }
                }'
                echo "Secret engine created"
              fi

              REDIS_PASSWORD=$(kubectl get secret contract-vnext-redis-sentinel -o json | jq -r '.data["redis-password"]' | base64 -d)
              SENTINEL_PASSWORD=$(kubectl get secret contract-vnext-redis-sentinel -o json | jq -r '.data["sentinel-password"]' | base64 -d)
              
              if [ "$SECRET_CHECK" -ne 200 ]; then
                curl -sX POST "$VAULT_ADDR/v1/vnext-core-engine/data/workflow-secret" \
                -H "Content-Type: application/json" \
                -H "X-Vault-Token: $ROOT_TOKEN" \
                -d "{
                  \"data\": {
                    \"ConnectionStrings:Default\": \"Host=contract-vnext-postgres-headless;Port=5432;Database=vNext_WorkflowDb;Username=admin;Password=admin;\",
                    \"redis-password\": \"$REDIS_PASSWORD\",
                    \"sentinel-password\": \"$SENTINEL_PASSWORD\"
                  }
                }"
                echo "Secret data created"
              else
                echo "Secret 'workflow-secret' already exists."
              fi
              rm /tmp/keys.json
          env:
            - name: VAULT_ADDR
              value: "http://contract-vault:8200"
      restartPolicy: Never
---
