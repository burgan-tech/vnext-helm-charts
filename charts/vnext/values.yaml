  enabled: false
  replicaCount: 1
  image:
    registry: docker.io
    repository: dpage/pgadmin4
    tag: "latest"
    imagePullPolicy: IfNotPresent
    
  auth:
    email: "admin@example.com"
    password: "admin"
  
  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi
  service:
    type: ClusterIP


# Mockoon - API Mocking tool
# Lightweight API mocking server for development and testing
mockoon:
  # Enable Mockoon (recommended: true for dev, false for production)
  enabled: false
  replicaCount: 1
  args: ["--data", "/data/migration-api.json", "--port", "3001", "--hostname", "0.0.0.0"]
  
  image:
    registry: docker.io
    repository: mockoon/cli
    tag: "latest"
    imagePullPolicy: IfNotPresent
  
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 128Mi
  
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 10
  
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 10
  
  service:
    type: ClusterIP
    port: 3001

# OpenObserve - Observability platform
# Open-source alternative to Datadog, New Relic, etc.
# Note: For production, consider using dedicated observability solutions
openobserve:
  # Enable OpenObserve (recommended: true for dev, false for production)
  enabled: false
  replicaCount: 1
  
  image:
    registry: public.ecr.aws
    repository: zinclabs/openobserve
    tag: "latest"
    imagePullPolicy: IfNotPresent
  
  auth:
    username: "admin@example.com"
    password: "admin"
  service:
    type: ClusterIP
# OpenTelemetry Collector
opentelemetry-collector:
  enabled: true
  mode: deployment
  
  image:
    repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"
    pullPolicy: IfNotPresent
    tag: ""
  
  imagePullSecrets: []
  
  configMap:
    create: false
    existingName: "opentelemetry-collector-config"

# Prometheus Stack
kube-prometheus-stack:
  enabled: true
  alertmanager:
    enabled: false
  nodeExporter:
    enabled: false
  prometheus:
    prometheusSpec:
      additionalScrapeConfigsSecret:
        enabled: true
        name: "vnext-prometheus-scrape-config"
        key: "additional-scrape-configs.yaml"
  grafana:
    defaultDashboardsEnabled: false  # Disable default operator dashboards
    sidecar:
      dashboards:
        enabled: true
